const LOAD = { total: 0, done: 0 };

function loadCounted(im, onOk){
  LOAD.total++;
  let counted = false;
  const fin = (ok) => { if (!counted){ counted = true; LOAD.done++; if (ok && onOk) onOk(); } };
  im.onload = () => fin(true);
  im.onerror = () => fin(false);
}

/* ---- 四状态背景图＋移位转换特效（纯视觉：不碰物理、时序、判定） ----
   背景图 cover 预渲染成离屏瓦片（正＋镜像各一），横向镜像平铺、0.2 倍速视差。
   图片没加载完/失败时对应状态瓦片为 null，draw 自动回退旧背景（纯色天＋剪影）。 */
const BG_FILES = ["bg/dawn.jpg", "bg/dusk.jpg", "bg/night.jpg", "bg/void.jpg"];
const BG_TH = 540;                                // 瓦片高＝画布高
const BG_TW = Math.round(768 * BG_TH / 512);      // 等比 cover 宽 = 810
const bgTiles = [null, null, null, null];
BG_FILES.forEach((src, i) => {
  const im = new Image();
  loadCounted(im, () => {
    const mk = (flip) => {
      const c = document.createElement("canvas"); c.width = BG_TW; c.height = BG_TH;
      const g = c.getContext("2d");
      if (flip){ g.translate(BG_TW, 0); g.scale(-1, 1); }
      g.drawImage(im, 0, 0, BG_TW, BG_TH);
      return c;
    };
    bgTiles[i] = { n: mk(false), f: mk(true) };
  });
  im.src = src;
});

function drawBgTiles(idx, alpha){
  const t = bgTiles[idx]; if (!t) return false;
  const period = BG_TW * 2;
  const start = -(((camX * 0.2) % period) + period) % period;
  ctx.save(); ctx.globalAlpha = alpha;
  for (let x = start; x < CONFIG.viewW; x += period){
    ctx.drawImage(t.n, x, 0);
    ctx.drawImage(t.f, x + BG_TW, 0);
  }
  ctx.restore();

}

  const now = performance.now();
  if (ring !== bgTo){ bgFrom = bgTo; bgTo = ring; bgT0 = now; }
  const a = Math.min(1, (now - bgT0) / 350);
  if (a >= 1) bgFrom = bgTo;

/* 健壮帧加载：逐帧记 settled（onload/onerror 都算），失败先自动重试 1 次再判 settled；
   全部 settled 后，最终失败的帧用相邻可用帧顶替该索引——保证每个索引永远有图可画；
   整套全军覆没才标 dead（调用方回退小点/跳过该套），不再出现「一帧挂掉整套回退」。 */
function loadFramesRobust(count, srcFor, onAllSettled, counted){
  if (counted) LOAD.total += count;   // counted=true 才计入加载页进度门（仅核心资源）
  const frames = [];
  const settled = new Array(count).fill(false);
  let settledCount = 0;
  const finish = () => {
    let anyGood = false;
    for (let i = 0; i < count; i++) if (frames[i].complete && frames[i].naturalWidth){ anyGood = true; break; }
    let dead = false;
    if (!anyGood) dead = true;
    else for (let i = 0; i < count; i++){
      if (!(frames[i].complete && frames[i].naturalWidth)){
        for (let d = 1; d < count; d++){
          const a = frames[i - d], b = frames[i + d];
          if (a && a.complete && a.naturalWidth){ frames[i] = a; break; }
          if (b && b.complete && b.naturalWidth){ frames[i] = b; break; }
        }
      }
    }
    onAllSettled(dead);
  };
  for (let i = 0; i < count; i++){
    const im = new Image();
    const src = srcFor(i);
    let retried = false;
    const settle = () => { if (!settled[i]){ settled[i] = true; if (counted) LOAD.done++; if (++settledCount === count) finish(); } };
    im.onload = settle;
    im.onerror = () => { if (!retried){ retried = true; im.src = src; } else settle(); };
    im.src = src;
    frames.push(im);
  }
  return frames;
}
/* 穿搭帧图：OUTFIT_SETS[id]＝整表 16 帧，OUTFIT_OVL[id]＝覆盖层 16 帧；ready/dead 逐套置位。
   穿搭共 288 张约 15MB，不进加载页进度门：先建空占位套（ready=false，形象页/选关弹窗/
   合成栈按既有口径跳过未就绪套——底套未就绪回退基础蛙、缩略图不画），进标题后由
   startOutfitLazyLoad 启动后台队列逐套串行加载（一套 16 帧齐发、套间串行，不抢首屏
   带宽），逐套就绪后自动出现在形象页与合成栈里。 */
const OUTFIT_SETS = {}, OUTFIT_OVL = {};
for (const d of OUTFIT_DEFS){
  OUTFIT_SETS[d.id] = { frames: [], ready: false, dead: false };
  OUTFIT_OVL[d.id] = { frames: [], ready: false, dead: false };
}
const outfitQueue = [];
for (const d of OUTFIT_DEFS){
  outfitQueue.push([OUTFIT_SETS[d.id], "frames-outfits/" + d.id]);
  outfitQueue.push([OUTFIT_OVL[d.id], "frames-outfits/" + d.id + "-overlay"]);
}
let outfitLazyStarted = false;
function startOutfitLazyLoad(){
  if (outfitLazyStarted) return;
  outfitLazyStarted = true;
  pumpOutfitQueue();
}
function pumpOutfitQueue(){
  const job = outfitQueue.shift();
  if (!job) return;
  const set = job[0], dir = job[1];
  set.frames = loadFramesRobust(16,
    i => dir + "/f" + String(i).padStart(2, "0") + ".png",
    dead => { set.dead = dead; set.ready = true; pumpOutfitQueue(); },
    false);
}

  // 危险掩码（第一批·数据层）：mask 为相位编号数组，该刺只在这些 ring 里是实体；
  // 无 mask 时走旧口径（set 与当前平台组相同才实体）。渲染/判定共用此函数。

  if (s.echo && echoOff[s.echo]) on = !on;

function trapRowOverlap(){

  const S = CONFIG.playerSize;
  const box = { x: player.x + 5, y: player.y + 5, w: S - 10, h: S - 10 };
  return trapRows.some(r => overlaps(box, { x: r.x, y: level.trap.surf - 20, w: TRAP_W, h: 20 }));
}
/* 与 step 里致命判定同口径的盒子：玩家是否正与任一活刺/巡逻刺重叠 */
function spikeOverlap(){
  const S = CONFIG.playerSize;
  const box = { x: player.x + 5, y: player.y + 5, w: S - 10, h: S - 10 };
  for (const s of level.spikes){
    if (!spikeActive(s)) continue;
    const sb = s.hang ? { x: s.x, y: s.y, w: 26, h: 20 } : { x: s.x, y: s.y - 20, w: 26, h: 20 };
    if (overlaps(box, sb)) return true;
  }
  for (const m of level.movers || []){
    if (!spikeActive(m)) continue;

/* Chiptune loop: tiny lookahead sequencer, all synthesized (no audio files).
   Am – F – C – G, bass + arpeggio. Starts on game start, M toggles it. */
const Music = (() => {
  let started = false, muted = false, step = 0, nextT = 0, timer = null;
  const BPM = 116, EIGHTH = 60 / BPM / 2;
  const BASS = [45, 41, 48, 43];                    // A2 F2 C3 G2, one bar each
  const ARP  = [[57,60,64,69],[53,57,60,65],[55,60,64,67],[55,59,62,67]];
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, dest){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = mf(m);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }
  function schedule(){
    if (!AC) return;
    while (nextT < AC.currentTime + 0.25){
      const bar = Math.floor(step / 8) % 4, s8 = step % 8;
      if (!muted){
        const master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
        if (s8 === 0 || s8 === 3 || s8 === 6) note(BASS[bar], nextT, 0.22, "triangle", 0.20, master);
        if (s8 === 4) note(BASS[bar] + 7, nextT, 0.18, "triangle", 0.14, master);
        const arpNotes = ARP[bar];
        note(arpNotes[step % 4], nextT, 0.12, "square", 0.045, master);
        if (step % 16 === 14) note(arpNotes[3] + 12, nextT, 0.2, "square", 0.04, master);
      }
      step++; nextT += EIGHTH;
    }
  }
  return {
    start(){ if (started || !AC) return; started = true; step = 0; nextT = AC.currentTime + 0.06; timer = setInterval(schedule, 90); },
    toggle(){ muted = !muted; return muted; },
    setMuted(m){ muted = !!m; },
    get muted(){ return muted; }
  };
})();

/* ---------------- physics ---------------- */
function burst(x, y, color){
  for (let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, color });

function overlaps(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function step(dt){

  if (deathCause && screen === "play") deathCause = "";   // 死因只在死亡当帧有效（护盾抵命后自动清）
  runTime += dt; levelTime += dt; attemptTime += dt; shieldOfferT += dt;
  if (shiftCD > 0) shiftCD -= dt;
  // 输入缓冲兑现：冷却刚结束且有缓存 → 立即执行（shift 内部按当刻规则复查）
  if (bufDir && shiftCD <= 0){ const d = bufDir; bufDir = 0; shift(d); }
  if (bufFxT > 0) bufFxT -= dt;
  if (rejFxT > 0) rejFxT -= dt;
  const st = curState(), S = CONFIG.playerSize, PH = 22;
  player.vx = CONFIG.runSpeed * speedMul();
  player.vy += CONFIG.gravity * st.grav * dt;
  player.vy = Math.max(-CONFIG.maxFall, Math.min(CONFIG.maxFall, player.vy));

  // 相位印记：着地越线记录 → 2s 后激活（存活 4s）；回声队列到点翻转机关
  const cxNow = player.x + 15;
  for (let i = 0; i < (level.imprints || []).length; i++){
    const im = level.imprints[i], st = imprintState[i];
    if (st && player.grounded && imprintPrevCx !== null && imprintPrevCx !== cxNow &&
        im.lines.some(L => (imprintPrevCx - L) * (cxNow - L) <= 0 && Math.abs(cxNow - L) < 40)){
      st.stage = 1; st.t = 2.0; st.ring = ring;   // 记录：当前切换不能撤销它
    }
    if (st && st.stage === 1){ st.t -= dt; if (st.t <= 0){ st.stage = 2; st.t = 4.0; } }
    else if (st && st.stage === 2){ st.t -= dt; if (st.t <= 0) st.stage = 0; }

  // 脆相平台计时：激活期间累积，满 0.8s 碎裂；不激活立即重置（切走再切回＝新平台）
  for (let i = 0; i < level.platforms.length; i++){
    const p = level.platforms[i];
    if (!p.fragile || !fragState[i]) continue;
    if (platActive(p)){ fragState[i].t += dt; if (fragState[i].t >= FRAG_LIFE) fragState[i].broken = true; }
    else { fragState[i].t = 0; fragState[i].broken = false; }
  }

  // (Solid AABB sides pin the player on platform corners at state seams —
  //  see BUG_LOG 2026-11-21. Swept landing on the gravity-facing surface only.)
  const prevY = player.y;

  player.y += player.vy * dt;

  for (let pi = 0; pi < level.platforms.length; pi++){

    if (p.fragile && fragState[pi] && fragState[pi].broken) continue;   // 已碎：穿过去
    if (player.x + S <= p.x || player.x >= p.x + p.w) continue;
    if (st.grav > 0 && player.vy >= 0 && prevY + S <= p.y + 0.01 && player.y + S >= p.y){
      player.y = p.y - S; player.vy = 0; player.grounded = true;
    } else if (st.grav < 0 && player.vy <= 0 && prevY >= p.y + PH - 0.01 && player.y <= p.y + PH){
      player.y = p.y + PH; player.vy = 0; player.grounded = true;
    }
  }
  if (player.grounded) { coyote = 0.12; airFlip = true; } else coyote -= dt;
  // —— 对账门（只进 16/24/29/30）：越过门 x 的瞬间对账 ——
  // 已用次数 %4 必须等于门的 need；不对＝当场判死（红闪＋「账对不上」），
  // 与普通扎死/坠落区分开。放在扎刺判定之前：门先开口，别让后面的刺抢死因。
  for (const g of level.gates || []){
    if (prevX < g.x && player.x >= g.x){
      if (((budgetUsed % 4) + 4) % 4 !== g.need){
        deathCause = "gate";
        gateFail = { need: g.need, used: budgetUsed, x: g.x };
        gateFlash = 0.6;
        die(); return;
      }
      gatePassFx = 0.5;
    }
  }
  // 安全检查点计时：连续着地时间（记录动作在全机关卡判定之后，见下方 goal 前）
  if (player.grounded) groundTime += dt; else groundTime = 0;
  if (invulnT > 0) invulnT -= dt;
  if (shieldFxT > 0) shieldFxT -= dt;
  let box = { x: player.x, y: player.y, w: S, h: S };
  // spikes
  box = { x: player.x + 5, y: player.y + 5, w: S - 10, h: S - 10 };
  for (const s of level.spikes){
    if (!spikeActive(s)) continue;
    const sb = s.hang ? { x: s.x, y: s.y, w: 26, h: 20 } : { x: s.x, y: s.y - 20, w: 26, h: 20 };
    if (overlaps(box, sb)) { die(); return; }
  }
  // moving spikes (patrolling hazards, phase-locked to the attempt clock)
  for (const m of level.movers || []){
    if (!spikeActive(m)) continue;
    const mp = moverPos(m);
    const sb = m.hang ? { x: mp.x, y: mp.y, w: 26, h: 20 } : { x: mp.x, y: mp.y - 20, w: 26, h: 20 };
    if (overlaps(box, sb)) { die(); return; }
  }
  // 相位刺：相位推进瞬间记一个缩放脉冲（让轮换看得见）；仅 ring 与相位相同才是实体
  const phs = level.phases || [];
  for (let i = 0; i < phs.length; i++){
    const ph = phaseOf(phs[i]);
    if (phasePrev[i] !== undefined && ph !== phasePrev[i]) phasePulse[i] = 0.25;
    phasePrev[i] = ph;
    if (phasePulse[i] > 0) phasePulse[i] -= dt;
    if (ph === ring && overlaps(box, phaseBox(phs[i]))) { die(); return; }
  }
  // 移位陷阱「落点生刺」：升起进度 ≥0.85 的刺排致命
  if (level.trap){
    for (const r of trapRows){
      if (trapProgress(r) < TRAP_DEADLY) continue;
      const sb = { x: r.x, y: level.trap.surf - 20, w: TRAP_W, h: 20 };
      if (overlaps(box, sb)) { lastDeathTrap = true; die(); return; }
    }
  }
  // 相位印记激活刺：只在被记录的 ring 里致命
  for (let i = 0; i < (level.imprints || []).length; i++){
    const im = level.imprints[i], st = imprintState[i];
    if (st && st.stage === 2 && st.ring === ring){
      const sb = im.hang ? { x: im.ax, y: im.y, w: 26, h: 20 } : { x: im.ax, y: im.y - 20, w: 26, h: 20 };
      if (overlaps(box, sb)) { die(); return; }
    }
  }
  // 共相锚定物：任何相位都致命（22px 刺球盒）
  for (const a of level.anchors || []){
    const ap = anchorPos(a);
    if (overlaps(box, { x: ap.x - 11, y: ap.y - 11, w: 22, h: 22 })) { die(); return; }
  }
  // orbs: touching one restores the mid-air gravity flip (回气珠)
  for (let i = 0; i < (level.orbs || []).length; i++){
    if (orbTaken[i]) continue;
    const o = level.orbs[i], dx = player.x + 15 - o.x, dy = player.y + 15 - o.y;
    if (dx * dx + dy * dy < 36 * 36 && !airFlip){
      airFlip = true; orbTaken[i] = true;
      burst(o.x, o.y, "#66d9e8"); sfx("goal");
    }
  }
  // 异变事件：电报式强制移位。方向由关卡数据 dir 字段写死（缺省 +1）——
  // 旧版用 Math.random 掷方向，同一输入序列每局结果不同，违反确定性口径，
  // 已按规则冻结（RULES-规则冻结.md）改为数据驱动。
  for (let i = 0; i < (level.events || []).length; i++){
    if (evDone[i]) continue;
    if (player.x >= level.events[i].x){
      evDone[i] = true;
      evWarn = { dir: level.events[i].dir || 1, t: 0.85 };
      sfx("deny");
    }
  }
  if (evWarn){
    evWarn.t -= dt;
    if (evWarn.t <= 0){ forceShift(evWarn.dir); evWarn = null; }
  }
  // fell / flew out
  if (player.y > CONFIG.killBelowY || player.y < CONFIG.killAboveY) { die(); return; }
  // 安全检查点记录：本步已通过全部致命判定（活着的实地面站立）才记——连续着地 ≥0.3s
  // 的最后位置＋当时 ring；压着陷阱刺排或与活刺/巡逻刺重叠的位置不记（不把死点记成安全点）。
  // 历史表每前进 ≥40px 或换 ring 追加一条（复活选点回退用），上限 60 条。
  if (player.grounded && groundTime >= 0.3 && !trapRowOverlap() && !spikeOverlap()){
    checkpoint = { x: player.x, y: player.y, ring, used: budgetUsed };   // 快照含已用预算次数
    const lastCp = checkpoints[checkpoints.length - 1];
    if (!lastCp || lastCp.ring !== ring || Math.abs(checkpoint.x - lastCp.x) >= 40){
      checkpoints.push(checkpoint);
      if (checkpoints.length > 60) checkpoints.shift();
    }
  }
  // goal (zone box; works for floor flags and ceiling flags)
  const g = level.goal;
  if (overlaps({ x: player.x, y: player.y, w: S, h: S }, g)){
    commitLevel();
    // 解锁落账在过关当下完成：之后点下一关/重玩/选关/主页都不会吞掉已通关进度
    if (levelIdx + 1 > unlocked) { unlocked = Math.min(levelIdx + 1, LEVELS.length - 1); saveUnlock(); }
    sfx("goal");
    if (window.FX) FX.spawn("clear", g.x + g.w / 2 - camX, g.y + g.h / 2);   // FX：通关光效
    if (levelIdx + 1 >= LEVELS.length) { commitRun(); screen = "win"; }   // 最后一关 → 全通关页
    else screen = "clear";
  }
  tutAdvance();
  if (!(SHOT && deathFx)) camX = Math.max(0, Math.min(level.width - CONFIG.viewW, player.x - 300));
  // particles
  for (const pt of particles){ pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
  particles = particles.filter(pt => pt.life > 0);
  // 奶蛙动画状态（纯视觉）：跑步相位随距离推进、落地压扁、死亡残影计时、提示已展示标记
  if (player.grounded) runPhase += player.vx * dt / 30;
  if (player.grounded && !wasGrounded) landSquash = 0.13;
  wasGrounded = player.grounded;
  if (landSquash > 0) landSquash -= dt;
  if (deathFx){ deathFx.t -= dt; if (deathFx.t <= 0) deathFx = null; }
  if (trapHintArmed) trapHintEver = true;
  if (flash > 0) flash -= dt;
  if (denyT > 0) denyT -= dt;
  if (gateFlash > 0) gateFlash -= dt;
  if (gatePassFx > 0) gatePassFx -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 14);
}
function die(){
  if (invulnT > 0) return;   // 复活后 1s 无敌：不触发死亡（防落点连环死）
  if (shield){
    // 护盾抵命：不死亡、不计死亡数——消耗护盾＋1.5s 无敌闪烁＋碎盾金环，继续跑；
    // 本局那 1 次广告复活不受影响（还没死过）。陷阱死标记一并清掉，别误武装提示。
    shield = false; lastDeathTrap = false;
    gateFail = null; deathCause = ""; gateFlash = 0;
    invulnT = 1.5; shieldFxT = 0.5;
    burst(player.x + 15, player.y + 15, "#ffd166");
    sfx("goal");
    return;
  }
  deaths++; runDeaths++; sfx("die"); burst(player.x + 15, player.y + 15, "#ff5d5d");
  if (window.FX) FX.spawn("die", player.x + 15 - camX, Math.min(player.y + 30, 505));   // FX：死亡爆点（坠落死钳回画面内）
  deathFx = { x: player.x, y: player.y, grav: curState().grav, t: SHOT ? 3 : 0.45, frame: naiwaFrame };
  // 陷阱死提示在死亡当下武装（与旧版即时重开同口径：下一次尝试只显示一次）
  if (lastDeathTrap && !trapHintEver) trapHintArmed = true;
  screen = "dying";   // 定格播完 → 死亡面板自选（看广告复活／重玩本关／回主页），不再自动重生
}
/* 死亡定格期间：只推进残影/粒子/闪光计时，世界其余冻结；定格播完切到死亡面板 */
function tickDeath(dt){
  if (deathFx){
    deathFx.t -= dt;
    if (deathFx.t <= 0){ deathFx.t = 0; screen = "dead"; }
  } else screen = "dead";
  for (const pt of particles){ pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
  particles = particles.filter(pt => pt.life > 0);
  if (flash > 0) flash -= dt;
  if (denyT > 0) denyT -= dt;
  if (gateFlash > 0) gateFlash -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 14);
}

/* ---------------- render ---------------- */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/* ---------------- 奶蛙精灵版（主人 2026-11-23 给的跑步精灵图切帧，frames/f00–f14） ----------------
   帧画布 248×270，内容底（脚底基线）在第 266 行；f00 站立，f01–f14 跑步循环，
   f05/f06 为第二行腾空大步帧。精灵未就绪（加载中/整套失败）时一律回退小点，绝不画程序蛙。
   帧推进按奔跑距离（每 15px 一帧），不按时间——脚步与地面速度对齐，不打滑。 */
const NAIWA_DH = 68;                 // 绘制高度（碰撞盒仍是原 30px，脚底对齐盒底边）
const NAIWA_STRIDE = 13;             // 每帧推进的奔跑距离 px
const NAIWA_LOOP = [2, 3, 4, 10, 11, 12, 13, 14];  // 地面跑循环：只留连续迈步帧；站立 f00、腾空 f05/f06、复位 f01/f07/f08/f09 不进地面循环（混入会一顿一顿）
let naiwaReady = false, naiwaDead = false, naiwaFrame = 0, naiwaAir = 0;
const NAIWA_FRAMES = loadFramesRobust(15,
  i => "frames/f" + String(i).padStart(2, "0") + ".png",
  dead => { naiwaDead = dead; naiwaReady = true; }, true);
// 悬浮滑翔图（主人艺源通道生成，frames/hover.png，931×782 已去底）：滞空超过约 0.23s 后接管腾空姿势；原图面朝左，故绘制时朝向取反
const NAIWA_HOVER = new Image();
let naiwaHoverReady = false;
loadCounted(NAIWA_HOVER, () => { naiwaHoverReady = true; });
NAIWA_HOVER.src = "frames/hover.png";
/* 穿搭合成栈：底图取优先级 手持＞衣服＞帽子 的整表帧，其余已穿件叠覆盖层，
   顺序 底图→衣服层→帽子层→手持层。无穿戴返回 null（走 base 原路径，逐像素不变）。
   底图未加载完也返回 null 整体回退；单个覆盖层未就绪只跳过该层。 */
function frogLayers(){
  let bottom = null;
  for (const slot of ["hand", "clothes", "hat"])
    if (skins.outfits[slot] && outfitDef(skins.outfits[slot])){ bottom = skins.outfits[slot]; break; }
  if (!bottom || !OUTFIT_SETS[bottom].ready || OUTFIT_SETS[bottom].dead) return null;
  const layers = [{ set: OUTFIT_SETS[bottom], meta: OUTFIT_META[bottom] }];
  for (const slot of ["clothes", "hat", "hand"]){
    const id = skins.outfits[slot];
    if (id && id !== bottom && outfitDef(id)) layers.push({ set: OUTFIT_OVL[id], meta: OUTFIT_META[id] });
  }
  return layers;
}
function drawSetFrame(set, meta, idx, DH){
  if (!set || !set.ready || set.dead) return;
  const img = set.frames[idx];
  if (!img || !(img.complete && img.naturalWidth)) return;
  const k = DH / 270;   // 缩放恒按 270 基准：各套身体尺度与 base 一致，画布只是更高/更宽
  ctx.drawImage(img, -meta.ax * k, -meta.B * k, meta.W * k, meta.H * k);
}
/* 形象页预览用：在 (cx, baseY) 处以高度 DH 画当前奶蛙（含穿搭合成），帧号 idx */
function drawFrogStackAt(cx, baseY, DH, idx){
  const k = DH / 270;
  const draw = (frames, meta) => {
    const img = frames[idx];
    if (img && img.complete && img.naturalWidth)
      ctx.drawImage(img, cx - meta.ax * k, baseY - meta.B * k, meta.W * k, meta.H * k);
  };
  const layers = frogLayers();
  if (!layers){ draw(NAIWA_FRAMES, BASE_META); return; }
  for (const L of layers) draw(L.set.frames, L.meta);
}
function drawFrogSprite(cx, feetY, o){
  if (!naiwaReady || naiwaDead){ drawDot(cx, feetY, o); return; }
  if (o.frame === undefined) naiwaAir = o.airborne ? naiwaAir + 1 : 0;
  const layers = frogLayers();
  const useHover = o.frame === undefined && o.airborne && naiwaAir > 14 && (layers ? true : naiwaHoverReady);
  // 选帧：o.frame 显式指定（死亡定格）> 悬浮（长滞空）> 腾空 > 站立 > 跑步循环
  let idx;
  if (o.frame !== undefined) idx = o.frame;
  else if (o.airborne) idx = (player.vy * curState().grav < 0) ? 5 : 6;  // 离开地面用 f05，落回用 f06
  else {
    const dist = (o.phase || 0) * 30;                                    // runPhase 以 1/30 px 为单位累积
    idx = dist < 2 ? 0 : NAIWA_LOOP[Math.floor(dist / NAIWA_STRIDE) % NAIWA_LOOP.length];
  }
  if (o.frame === undefined) naiwaFrame = useHover ? "hover" : idx;
  // 兜底：无穿搭、非悬浮路径下本帧图不可用（理论上顶替后不会发生）→ 画小点，绝不画程序蛙
  if (!layers && !useHover){
    const img0 = NAIWA_FRAMES[idx];
    if (!img0 || !(img0.complete && img0.naturalWidth)){ drawDot(cx, feetY, o); return; }
  }
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.translate(cx, feetY);
  if (o.gravUp) ctx.scale(1, -1);
  if (useHover && !layers){
    const HH = 58, HW = HH * (931 / 782);   // 按绿眼直径与跑步帧对齐（眼 78/782 → 与跑帧 23/270×68 同为约 5.8px），肚皮宽度随之与跑姿一致，不再显大
    ctx.scale(-o.face * (1 + (1 - o.squash) * 0.35), o.squash);
    ctx.drawImage(NAIWA_HOVER, -HW / 2, -HH * 0.92, HW, HH);
  } else if (layers){
    // 穿着穿搭：滑翔用各套第 16 帧（已离线注册到悬浮图落点），其余帧号与 base 同规
    ctx.scale(o.face * (1 + (1 - o.squash) * 0.35), o.squash);
    const fi = useHover ? 15 : idx;
    for (const L of layers) drawSetFrame(L.set, L.meta, fi, NAIWA_DH);
  } else {
    const img = NAIWA_FRAMES[idx];
    const DW = NAIWA_DH * (248 / 270);
    ctx.scale(o.face * (1 + (1 - o.squash) * 0.35), o.squash);
    ctx.drawImage(img, -DW / 2, -NAIWA_DH * (266 / 270), DW, NAIWA_DH);
  }
  ctx.restore();
}
/* ---------------- 小点（初始形象，四相原版画法） ----------------
   CN 原版：30×30 圆角方块（r=8）填当前状态 player 色 + 深色眼睛一只
   （grav>0 眼在 y+11，grav<0 眼在 y+S-15）。这里沿用与精灵版相同的
   (cx, feetY, o) 约定：feetY 为贴地边，压扁锚定贴地边，眼位与 CN 逐项对齐。 */
function drawDot(cx, feetY, o){
  const S = CONFIG.playerSize;
  const sq = o.squash === undefined ? 1 : o.squash;
  const w = S * (1 + (1 - sq) * 0.35), h = S * sq;
  const x = cx - w / 2;
  const y = o.gravUp ? feetY : feetY - h;
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.fillStyle = curState().player;
  rr(x, y, w, h, Math.min(8, h / 2)); ctx.fill();
  ctx.fillStyle = "#14142b";
  const ey = o.gravUp ? y + h - 15 * sq : y + 11 * sq;
  ctx.beginPath(); ctx.arc(cx + 5, ey, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
/* 渲染分发：当前形象决定走小点还是奶蛙（死亡定格走同一分发，压扁两边都成立） */
function drawPlayerSkin(cx, feetY, o){
  if (skins.current === "frog") drawFrogSprite(cx, feetY, o);
  else drawDot(cx, feetY, o);
}
function draw(){
  if (screen === "boot"){ drawBoot(); return; }
  if (screen === "map"){ drawMap(); return; }
  const st = curState(), W = CONFIG.viewW, H = CONFIG.viewH;
  ctx.fillStyle = st.sky; ctx.fillRect(0, 0, W, H);
  const imgBg = screen !== "title" && drawStateBg();   // 状态背景图（标题页维持原样）
  const sx = shake ? (Math.random() - 0.5) * shake : 0;
  const sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.save(); ctx.translate(-camX + sx, sy);
  // far silhouettes（仅回退旧背景时画；图片背景自带远景）
  if (!imgBg){
    ctx.fillStyle = st.far;
    for (let i = 0; i < 14; i++){ const bx = i * 260 + 40; ctx.fillRect(bx, 300 - (i % 3) * 40, 90, 260); }
  }
  // ratchet zone stripes
  for (const r of ratchetZones()){
    ctx.fillStyle = "rgba(255,92,92,0.06)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.strokeStyle = "rgba(255,92,92,0.35)"; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(r.x0, 0); ctx.lineTo(r.x0, CONFIG.viewH); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,120,120,0.8)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("⇢ 棘轮区 — 只能向前", r.x0 + 12, 90);
  }
  // v4 zone tints
  for (const r of level.inverts || []){
    ctx.fillStyle = "rgba(177,106,255,0.07)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.fillStyle = "rgba(200,150,255,0.85)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("⇄ 颠倒区 — 左右互换", r.x0 + 12, 90);
  }
  for (const r of level.locks || []){
    ctx.fillStyle = "rgba(160,170,190,0.10)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.fillStyle = "rgba(200,210,225,0.85)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("⊘ 凝滞区 — 无法移位", r.x0 + 12, 90);
  }
  for (const r of level.speeds || []){
    ctx.fillStyle = "rgba(255,212,59,0.05)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.fillStyle = "rgba(255,220,100,0.85)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("» 加速区", r.x0 + 12, 90);
  }
  // 对账门（纯视觉）：全高半透明光墙＋门顶的 need 数字（≡n）。判定在 step 里。
  for (const g of level.gates || []){
    const tp = performance.now() / 1000, pulse = 0.5 + 0.5 * Math.sin(tp * 2.4);
    const grd = ctx.createLinearGradient(g.x - 12, 0, g.x + 12, 0);
    grd.addColorStop(0, "rgba(120,220,255,0)");
    grd.addColorStop(0.5, "rgba(150,230,255," + (0.26 + 0.16 * pulse).toFixed(3) + ")");
    grd.addColorStop(1, "rgba(120,220,255,0)");
    ctx.fillStyle = grd; ctx.fillRect(g.x - 12, 0, 24, CONFIG.viewH);
    ctx.fillStyle = "rgba(150,230,255," + (0.06 + 0.05 * pulse).toFixed(3) + ")";
    ctx.fillRect(g.x - 2, 0, 4, CONFIG.viewH);
    ctx.fillStyle = "rgba(190,245,255," + (0.35 + 0.35 * pulse).toFixed(2) + ")";
    ctx.fillRect(g.x - 1, 0, 2, CONFIG.viewH);
    // 门顶徽章：≡n
    ctx.beginPath(); ctx.arc(g.x, 300, 20, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(6,20,32,0.72)"; ctx.fill();
    ctx.strokeStyle = "rgba(170,235,255," + (0.55 + 0.35 * pulse).toFixed(2) + ")"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "rgba(215,248,255,0.95)"; ctx.font = "bold 16px system-ui"; ctx.textAlign = "center";
    ctx.fillText("≡" + g.need, g.x, 306);
    // 小字：你是几（只在贴脸时显示，别和徽章糊在一起）
    if (Math.abs(g.x - player.x) < 260){
      ctx.fillStyle = "rgba(200,240,255,0.80)"; ctx.font = "bold 11px system-ui";
      ctx.fillText("你是 ≡" + (((budgetUsed % 4) + 4) % 4), g.x, 348);
    }
    if (gatePassFx > 0 && Math.abs(g.x - player.x) < 40){
      ctx.fillStyle = "rgba(255,255,255," + (gatePassFx * 0.5).toFixed(2) + ")";
      ctx.fillRect(g.x - 6, 0, 12, CONFIG.viewH);
    }
  }
  // ghost (inactive) platforms first
  for (const p of level.platforms){
    if (platActive(p)) continue;
    ctx.strokeStyle = p.set === "A" ? st.platA : st.platB;
    ctx.globalAlpha = 0.35; ctx.setLineDash([7, 7]); ctx.lineWidth = 2;
    ctx.lineDashOffset = -performance.now() / 28;
    ctx.strokeRect(p.x, p.y, p.w, 22); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  // active platforms
  for (let pi = 0; pi < level.platforms.length; pi++){
    const p = level.platforms[pi];
    if (!platActive(p)) continue;
    const fs = p.fragile ? fragState[pi] : null;
    if (fs && fs.broken){
      // 已碎：只剩淡虚线残影，明确「这里踩不了了」
      ctx.strokeStyle = "rgba(255,255,255,0.30)"; ctx.setLineDash([5, 6]); ctx.lineWidth = 1.5;
      ctx.strokeRect(p.x, p.y + 4, p.w, 14); ctx.setLineDash([]);
      continue;
    }
    ctx.fillStyle = p.set === "B" ? st.platB : st.platA;
    if (p.set === "AB") ctx.fillStyle = "#8d99ae";
    rr(p.x, p.y, p.w, 22, 5); ctx.fill();
    // 实体感：深色描边＋顶高光＋底暗边——与 HUD 条区分开（UI 优化，纯视觉）
    ctx.strokeStyle = "rgba(10,10,20,0.45)"; ctx.lineWidth = 2; rr(p.x, p.y, p.w, 22, 5); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.28)"; ctx.fillRect(p.x, p.y, p.w, 4);
    ctx.fillStyle = "rgba(0,0,0,0.28)"; ctx.fillRect(p.x, p.y + 18, p.w, 4);
    if (fs && fs.t > 0.02){
      // 脆相裂纹：随计时进度加深加多（0.8s 碎裂的可读预告）
      const pr = Math.min(1, fs.t / FRAG_LIFE);
      ctx.strokeStyle = "rgba(20,16,10," + (0.35 + 0.55 * pr).toFixed(2) + ")"; ctx.lineWidth = 1.6;
      ctx.beginPath();
      const n = 2 + Math.floor(pr * 5);
      for (let k = 0; k < n; k++){
        const fx = p.x + ((k + 0.5) / 7) * p.w;
        ctx.moveTo(fx, p.y + 2);
        ctx.lineTo(fx + ((k % 2) ? 7 : -6), p.y + 12);
        ctx.lineTo(fx + ((k % 2) ? -3 : 5), p.y + 20);
      }
      ctx.stroke();
    }
  }
  // spikes
  for (const s of level.spikes){
    if (!spikeActive(s)) { ctx.globalAlpha = 0.3; }
    ctx.fillStyle = "#ff5d5d";
    ctx.beginPath();
    if (s.hang){ ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + 13, s.y + 20); ctx.lineTo(s.x + 26, s.y); }
    else { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + 13, s.y - 20); ctx.lineTo(s.x + 26, s.y); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
  // movers: 加粗轨道 + 带实刺的滑座（刺簇约 30px、本体色随所在平台组，一眼是威胁；
  // 判定盒仍是原来的 26×20，视觉只做大不改判定）
  for (const m of level.movers || []){
    const mp = moverPos(m);
    const col = m.set === "B" ? st.platB : st.platA;
    const cxm = m.x + 13;
    // 轨道：滑座中心轨迹——竖轨穿行程全程、横轨贴地面成槽；两端止点
    ctx.strokeStyle = m.axis === "y" ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.30)";
    ctx.lineWidth = m.axis === "y" ? 5 : 4; ctx.lineCap = "round";
    ctx.beginPath();
    if (m.axis === "y"){ ctx.moveTo(cxm, m.y - m.dist); ctx.lineTo(cxm, m.y + m.dist); }
    else { ctx.moveTo(cxm - m.dist, m.y + 3); ctx.lineTo(cxm + m.dist, m.y + 3); }
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    if (m.axis === "y"){
      ctx.beginPath(); ctx.arc(cxm, m.y - m.dist, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cxm, m.y + m.dist, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillRect(cxm - m.dist - 2, m.y - 3, 4, 10);
      ctx.fillRect(cxm + m.dist - 2, m.y - 3, 4, 10);
    }
    if (!spikeActive(m)) ctx.globalAlpha = 0.3;
    // 滑座：底座板 + 三尖刺簇
    ctx.fillStyle = col;
    if (m.hang){
      rr(mp.x - 4, mp.y - 6, 34, 7, 3); ctx.fill();
      for (let k = 0; k < 3; k++){
        const tx = mp.x - 2 + k * 10;
        ctx.beginPath(); ctx.moveTo(tx, mp.y); ctx.lineTo(tx + 5, mp.y + 20); ctx.lineTo(tx + 10, mp.y); ctx.closePath(); ctx.fill();
      }
    } else {
      rr(mp.x - 4, mp.y - 1, 34, 7, 3); ctx.fill();
      for (let k = 0; k < 3; k++){
        const tx = mp.x - 2 + k * 10;
        ctx.beginPath(); ctx.moveTo(tx, mp.y - 3); ctx.lineTo(tx + 5, mp.y - 23); ctx.lineTo(tx + 10, mp.y - 3); ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  // 相位刺：实体＝其相位的状态主题色实心；非实体＝同色半透明虚影（颜色即它当前
  // 相位）；刺旁四色指示点标出轮转位置，当前相位点亮放大——轮到谁一目了然
  for (let i = 0; i < (level.phases || []).length; i++){
    const p = level.phases[i], ph = phaseOf(p), col = phaseColor(ph);
    const solid = ph === ring;
    const cx = p.x + 13;
    const pulse = phasePulse[i] > 0 ? 1 + 0.4 * (phasePulse[i] / 0.25) : 1;
    ctx.save();
    ctx.globalAlpha = solid ? 1 : 0.28;
    ctx.fillStyle = col;
    ctx.translate(cx, p.y); ctx.scale(pulse, pulse); ctx.translate(-cx, -p.y);
    ctx.beginPath();
    if (p.on === "ceil"){ ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 13, p.y + 20); ctx.lineTo(p.x + 26, p.y); }
    else { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 13, p.y - 20); ctx.lineTo(p.x + 26, p.y); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    const dy = p.on === "ceil" ? p.y + 34 : p.y - 34;
    for (let k = 0; k < 4; k++){
      ctx.globalAlpha = k === ph ? 1 : 0.3;
      ctx.fillStyle = phaseColor(k);
      ctx.beginPath(); ctx.arc(cx + (k - 1.5) * 11, dy, k === ph ? 4 : 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // —— 第二批机制渲染：回声区标记 / 相位印记（线·预告·激活刺）/ 共相锚定物 ——
  for (const z of level.echoes || []){
    const pending = echoQueue.some(q => q.id === z.id);
    ctx.strokeStyle = pending ? "rgba(255,209,102,0.95)" : "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(z.x0, 452); ctx.lineTo(z.x1, 452);
    ctx.moveTo(z.x0, 446); ctx.lineTo(z.x0, 458); ctx.moveTo(z.x1, 446); ctx.lineTo(z.x1, 458);
    ctx.stroke();
    if (pending){ ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc((z.x0 + z.x1) / 2, 444, 3.5, 0, Math.PI * 2); ctx.fill(); }
  }
  for (let i = 0; i < (level.imprints || []).length; i++){
    const im = level.imprints[i], st = imprintState[i];
    const baseY = im.hang ? im.y + 20 : im.y;
    // 记录线：细柱＋菱形（与激活刺上方的菱形同形呼应）
    for (const L of im.lines){
      ctx.strokeStyle = "rgba(177,151,255,0.55)"; ctx.lineWidth = 2; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(L, im.hang ? im.y : im.y - 44); ctx.lineTo(L, im.hang ? im.y + 44 : im.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.save(); ctx.translate(L, im.hang ? im.y + 30 : im.y - 52); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = st && st.stage > 0 ? "#b197fc" : "rgba(177,151,255,0.5)";
      ctx.fillRect(-5, -5, 10, 10); ctx.restore();
    }
    if (st && st.stage === 1){
      // 预告：目标点菱形轮廓＋倒计时弧（还剩 st.t / 2s）
      ctx.save(); ctx.translate(im.ax + 13, im.hang ? im.y + 34 : im.y - 36); ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = "#b197fc"; ctx.lineWidth = 2; ctx.strokeRect(-6, -6, 12, 12); ctx.restore();
      ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2.5; ctx.beginPath();
      ctx.arc(im.ax + 13, im.hang ? im.y + 34 : im.y - 36, 11, -Math.PI / 2, -Math.PI / 2 + (st.t / 2) * Math.PI * 2); ctx.stroke();
    }
    if (st && st.stage === 2){
      // 激活刺：常色红刺＋记录 ring 色芯＋菱形标记；非记录 ring 时影子化（现行语言）
      if (st.ring !== ring) ctx.globalAlpha = 0.3;
      ctx.fillStyle = "#ff5d5d"; ctx.beginPath();
      if (im.hang){ ctx.moveTo(im.ax, im.y); ctx.lineTo(im.ax + 13, im.y + 20); ctx.lineTo(im.ax + 26, im.y); }
      else { ctx.moveTo(im.ax, im.y); ctx.lineTo(im.ax + 13, im.y - 20); ctx.lineTo(im.ax + 26, im.y); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = CONFIG.states[st.ring].player;
      ctx.beginPath(); ctx.arc(im.ax + 13, im.hang ? im.y + 7 : im.y - 7, 3, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(im.ax + 13, im.hang ? im.y + 34 : im.y - 36); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = "#b197fc"; ctx.fillRect(-5, -5, 10, 10); ctx.restore();
      ctx.globalAlpha = 1;
    }
    void baseY;
  }
  for (const a of level.anchors || []){
    const ap = anchorPos(a);
    ctx.save(); ctx.translate(ap.x, ap.y); ctx.rotate(attemptTime * 1.5);
    ctx.fillStyle = "#ff5d5d";
    for (let k = 0; k < 8; k++){
      ctx.rotate(Math.PI / 4);
      ctx.beginPath(); ctx.moveTo(-3.5, -9); ctx.lineTo(3.5, -9); ctx.lineTo(0, -16); ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fillStyle = "#2b2d42"; ctx.fill();
    ctx.strokeStyle = "#e9ecef"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, Math.PI * 2); ctx.fillStyle = "#ff5d5d"; ctx.fill();
    ctx.restore();
  }
  // orbs
  for (let i = 0; i < (level.orbs || []).length; i++){
    if (orbTaken[i]) continue;
    const o = level.orbs[i], pr = 10 + Math.sin(performance.now() / 240) * 2;
    ctx.strokeStyle = "#66d9e8"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(o.x, o.y, pr + 5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#a5f3fc";
    ctx.beginPath(); ctx.arc(o.x, o.y, pr - 3, 0, Math.PI * 2); ctx.fill();
  }
  // goal flag (stands on a floor surface, or hangs from a ceiling one)
  const g = level.goal;
  if (g.ceil){
    ctx.fillStyle = "#e9ecef"; ctx.fillRect(g.x + 15, g.surf, 4, 62);
    ctx.fillStyle = "#51cf66"; ctx.beginPath();
    ctx.moveTo(g.x + 19, g.surf + 34); ctx.lineTo(g.x + 49, g.surf + 48); ctx.lineTo(g.x + 19, g.surf + 62);
  } else {
    ctx.fillStyle = "#e9ecef"; ctx.fillRect(g.x + 15, g.surf - 92, 4, 92);
    ctx.fillStyle = "#51cf66"; ctx.beginPath();
    ctx.moveTo(g.x + 19, g.surf - 92); ctx.lineTo(g.x + 49, g.surf - 78); ctx.lineTo(g.x + 19, g.surf - 64);
  }
  ctx.closePath(); ctx.fill();
  // 移位陷阱：焦痕（永久标记）→ 正在升起的刺排 → 死后提示（只出现一次）
  if (level.trap){
    const surf = level.trap.surf;
    for (const s of trapScorch){
      ctx.fillStyle = "rgba(24,14,8,0.55)";
      ctx.beginPath(); ctx.ellipse(s.x + TRAP_W / 2, surf - 1, TRAP_W / 2 + 4, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(24,14,8,0.8)";
      ctx.fillRect(s.x + 8, surf - 4, 5, 3); ctx.fillRect(s.x + 26, surf - 5, 6, 4); ctx.fillRect(s.x + 42, surf - 4, 5, 3);
    }
    for (const r of trapRows){
      const p = trapProgress(r);
      if (p <= 0) continue;
      const h = 20 * p;
      ctx.fillStyle = "#ff5d5d";
      for (let k = 0; k < 2; k++){
        const sx2 = r.x + k * 26;
        ctx.beginPath(); ctx.moveTo(sx2, surf); ctx.lineTo(sx2 + 13, surf - h); ctx.lineTo(sx2 + 26, surf); ctx.closePath(); ctx.fill();
      }
    }
    if (trapHintArmed && player.x < level.trap.x1){
      const hx = level.trap.x0 + 14, hy = surf - 64;
      ctx.font = "bold 15px system-ui";
      const tw = ctx.measureText("移位之后，别停").width + 24;
      ctx.fillStyle = "rgba(8,10,24,0.88)"; rr(hx, hy, tw, 30, 9); ctx.fill();
      ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 1.5; rr(hx, hy, tw, 30, 9); ctx.stroke();
      ctx.fillStyle = "#ffd166"; ctx.textAlign = "left";
      ctx.fillText("移位之后，别停", hx + 12, hy + 20);
    }
  }
  // player —— 按当前形象分发（小点＝原版方块／奶蛙＝精灵，碰撞盒仍是原 30px）
  // 标题页不画世界里的主角：标题底色是半透明罩，出生点的主角会透出来贴在选关格边缘（残影），标题形象只走 drawTitle 的预览
  if (screen !== "title"){
    const S = CONFIG.playerSize;
    const sq = landSquash > 0 ? 1 - 0.25 * Math.sin(Math.PI * (1 - landSquash / 0.13)) : 1;
    // 死亡定格/面板期间不画活主角（尸体由 deathFx 压扁残影呈现）；复活无敌期闪烁
    if (screen !== "dying" && screen !== "dead")
      drawPlayerSkin(player.x + S / 2, st.grav > 0 ? player.y + S : player.y,
        { face: player.vx < 0 ? -1 : 1, gravUp: st.grav < 0, phase: runPhase, airborne: !player.grounded, squash: sq,
          alpha: invulnT > 0 ? (Math.floor(performance.now() / 90) % 2 ? 0.3 : 0.85) : 1 });
    if (deathFx){
      drawPlayerSkin(deathFx.x + S / 2, deathFx.grav > 0 ? deathFx.y + S : deathFx.y,
        { face: 1, gravUp: deathFx.grav < 0, phase: Math.PI / 2, airborne: false, squash: 0.22, alpha: 0.95, frame: deathFx.frame });
    }
  }
  // particles
  for (const pt of particles){ ctx.globalAlpha = Math.max(pt.life, 0) * 1.8; ctx.fillStyle = pt.color; ctx.fillRect(pt.x - 3, pt.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  // 移位光环脉冲：以玩家为中心扩散（0.35 秒，纯视觉）
  if (shiftPulse){
    const age = (performance.now() - shiftPulse.t0) / 1000;
    if (age > 0.35) shiftPulse = null;
    else {
      const k = age / 0.35, S2 = CONFIG.playerSize;
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.strokeStyle = shiftPulse.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(player.x + S2 / 2, player.y + S2 / 2, 12 + 40 * k, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  // 碎盾反馈：玩家身上金色扩散环（0.5 秒，纯视觉，与 die() 里的金粒子同帧触发）
  if (shieldFxT > 0){
    const k = 1 - shieldFxT / 0.5, S3 = CONFIG.playerSize;
    ctx.globalAlpha = (1 - k) * 0.95;
    ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(player.x + S3 / 2, player.y + S3 / 2, 16 + 34 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (flash > 0){ ctx.fillStyle = "rgba(255,255,255," + (flash * 0.5) + ")"; ctx.fillRect(0, 0, W, H); }
  // 对账失败：整屏红闪（与普通死亡的白闪/无闪区分开）
  if (gateFlash > 0){ ctx.fillStyle = "rgba(255,38,52," + Math.min(0.55, gateFlash * 0.9) + ")"; ctx.fillRect(0, 0, W, H); }

  if (evWarn && screen === "play"){
    ctx.fillStyle = "rgba(20,10,0,0.45)"; ctx.fillRect(0, 150, W, 64);
    ctx.fillStyle = "#ffd43b"; ctx.font = "bold 26px system-ui"; ctx.textAlign = "center";
    ctx.fillText(evWarn.dir > 0 ? "⚠ 异变！即将强制前移 →" : "⚠ 异变！即将强制后移 ←", W / 2, 192);
  }
  if (screen === "play" || screen === "clear" || screen === "dying" || screen === "dead") drawHUD();
  if (screen === "title") drawTitle();
  if (screen === "clear") drawClearOverlay();
  if (screen === "win") drawWin();
  if (screen === "dead") drawDeathPanel();
  // 对账失败的专属字样：定格与死亡面板上都写清「门要几、你是几」
  if ((screen === "dying" || screen === "dead") && deathCause === "gate" && gateFail){
    const m = ((gateFail.used % 4) + 4) % 4;
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(10,0,2,0.62)"; rr(W / 2 - 210, 196, 420, 74, 14); ctx.fill();
    ctx.strokeStyle = "rgba(255,93,93,0.9)"; ctx.lineWidth = 2; rr(W / 2 - 210, 196, 420, 74, 14); ctx.stroke();
    ctx.fillStyle = "#ff7b7b"; ctx.font = "bold 26px system-ui";
    ctx.fillText("账对不上", W / 2, 230);
    ctx.fillStyle = "#ffd7d7"; ctx.font = "bold 15px system-ui";
    ctx.fillText("这道门要 ≡" + gateFail.need + "，你带过来的是 ≡" + m + "（已用 " + gateFail.used + " 次）", W / 2, 256);
  }
  drawShieldChip();
  // touch pads：命中热区（padL/padR）保持不变；可视底板缩小＋降透明（UI 优化，
  // 减轻对来袭方向的遮挡）。冷却反馈：缓存命中→对应垫金边；拒绝→对应垫变灰抖动。
  padL = { x: 16, y: H - 92, w: 196, h: 74 }; padR = { x: W - 212, y: H - 92, w: 196, h: 74 };
  if (screen === "play" && !SHOT){
    const inv = inInvert();
    const drawPad = (pad, side, label) => {
      const vw = 148, vh = 54;
      let vx = pad.x + (pad.w - vw) / 2, vy = pad.y + (pad.h - vh) / 2;
      const rejected = rejFxT > 0 && rejSide === side;
      if (rejected) vx += Math.sin(performance.now() / 18) * 3;
      ctx.globalAlpha = rejected ? 0.30 : 0.38;
      ctx.fillStyle = rejected ? "#9aa0ae" : "#ffffff";
      rr(vx, vy, vw, vh, 12); ctx.fill();
      ctx.globalAlpha = 1;
      if (bufFxT > 0 && bufSide === side){
        ctx.strokeStyle = "rgba(255,209,102,0.95)"; ctx.lineWidth = 3;
        rr(vx - 2, vy - 2, vw + 4, vh + 4, 13); ctx.stroke();
      }
      ctx.fillStyle = "#14142b"; ctx.font = "bold 19px system-ui"; ctx.textAlign = "center";
      ctx.fillText(label, vx + vw / 2, vy + 35);
    };
    drawPad(padL, -1, inv ? "前移 ▶" : "◀ 后移");
    drawPad(padR, 1, inv ? "◀ 后移" : "前移 ▶");
  }
  drawTut();
}
/* 护盾小图标（Canvas 路径盾形） */
function drawShieldIcon(cx, cy, color){
  ctx.beginPath();
  ctx.moveTo(cx, cy - 9);
  ctx.lineTo(cx + 7.5, cy - 6);
  ctx.lineTo(cx + 7.5, cy + 1.5);
  ctx.quadraticCurveTo(cx + 7.5, cy + 7.5, cx, cy + 10);
  ctx.quadraticCurveTo(cx - 7.5, cy + 7.5, cx - 7.5, cy + 1.5);
  ctx.lineTo(cx - 7.5, cy - 6);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();

/* ---------------- 形象解锁：看视频（广告）通道 ----------------
   优先走平台层门面 window.Plat.ads（真广告，看完才算成功）；
   无真广告的环境（Pages）走测试桩：明确标注「测试环境」的 3 秒模拟广告，
   可取消，取消/失败绝不解锁。单飞：重复点不重复触发。 */
let adBusy = false;
let adFailNext = false;   // 测试专用：下一次广告按「加载失败/无填充」结算（验区域门免费兜底）
/* 广告结果三态：ok＝看完 / cancel＝用户取消 / fail＝加载失败·无填充·回调超时。
   区域广告门的免费兜底只认 fail 不认 cancel，故有详细版；其余入口（形象/复活/
   护盾）继续用布尔版 unlockViaAd（仅 ok 算成功，口径不变）。 */
function unlockViaAdDetailed(){
  return new Promise((resolve) => {
    if (adBusy){ resolve("cancel"); return; }   // 已有广告在播：按未观看处理，不重复触发
    if (adFailNext){ adFailNext = false; resolve("fail"); return; }
    if (window.Plat && Plat.ads && typeof Plat.ads.available === "function" && typeof Plat.ads.show === "function"){
      let avail = false;
      try { avail = !!Plat.ads.available(); } catch(e) {}
      if (avail){
        adBusy = true;
        let settled = false;
        const done = (ok) => { if (!settled){ settled = true; adBusy = false; resolve(ok ? "ok" : "fail"); } };
        try {
          const r = Plat.ads.show("skin");
          if (r && typeof r.then === "function") r.then(done).catch(() => done(false));
          else done(!!r);
        } catch(e) { done(false); }
        setTimeout(() => done(false), 200000);   // 看门狗：回调永不来按失败处理，不锁人
        return;
      }
    }
    adBusy = true;
    showStubAd((res) => { adBusy = false; resolve(res); });   // 桩广告回调 "ok"/"cancel"
  });
}
function unlockViaAd(){
  return unlockViaAdDetailed().then(r => r === "ok");
}
function showStubAd(cb){
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(3,4,10,0.93);display:flex;align-items:center;justify-content:center;z-index:99;";
  ov.innerHTML = '<div style="text-align:center;color:#dfe3ee;max-width:82vw;">'
    + '<div style="font-size:13px;color:#ffd166;letter-spacing:2px;">测试环境 · 模拟广告</div>'
    + '<div style="font-size:24px;font-weight:bold;margin:18px 0 6px;">奶蛙正在赶来…</div>'
    + '<div id="stubAdCount" style="font-size:15px;color:#8d99ae;">3 秒后完成</div>'
    + '<button id="stubAdCancel" style="margin-top:22px;padding:9px 26px;font-size:15px;border-radius:10px;border:1px solid rgba(255,255,255,0.35);background:transparent;color:#dfe3ee;cursor:pointer;">取消</button></div>';
  document.body.appendChild(ov);
  let left = 3, finished = false;
  const cnt = ov.querySelector("#stubAdCount");
  const timer = setInterval(() => {
    left--;
    if (left <= 0) finish(true);
    else cnt.textContent = left + " 秒后完成";
  }, 1000);
  function finish(ok){ if (finished) return; finished = true; clearInterval(timer); ov.remove(); cb(ok ? "ok" : "cancel"); }
  ov.querySelector("#stubAdCancel").addEventListener("click", () => finish(false));
}

/* 复活落点安全评估（主人 2026-11-24 反馈：复活到障碍旁边直接死）：
   候选点本身不压致命盒还不够——自动奔跑没有停/跳，落点前方紧贴刺阵就是落地即死。
   runwayClear 按候选点记录的 ring 评估：从落点起前方约 1.5 秒跑程（runSpeed×1.5，
   条带再含玩家盒宽，保证无敌结束时人还没撞上危险）的扫掠条带内，不许有该 ring
   下致命的普通刺、巡逻刺全程范围、当前正致命的相位刺、已升满的陷阱刺排。 */
function spikeActiveFor(s, R){ return s.set === CONFIG.states[R].plat; }
function runwayClear(cp){
  const S = CONFIG.playerSize;
  const strip = { x: cp.x + 5, y: cp.y + 5, w: CONFIG.runSpeed * 1.5 + (S - 10), h: S - 10 };
  for (const s of level.spikes){
    if (!spikeActiveFor(s, cp.ring)) continue;
    const sb = s.hang ? { x: s.x, y: s.y, w: 26, h: 20 } : { x: s.x, y: s.y - 20, w: 26, h: 20 };
    if (overlaps(strip, sb)) return false;
  }
  for (const m of level.movers || []){
    if (!spikeActiveFor(m, cp.ring)) continue;
    const dx = m.axis === "x" ? m.dist : 0, dy = m.axis === "y" ? m.dist : 0;
    const y0 = m.hang ? m.y : m.y - 20;
    const sb = { x: m.x - dx, y: y0 - dy, w: 26 + dx * 2, h: 20 + dy * 2 };
    if (overlaps(strip, sb)) return false;
  }
  for (const p of level.phases || []){
    if (phaseOf(p) !== cp.ring) continue;
    if (overlaps(strip, phaseBox(p))) return false;
  }
  if (level.trap){
    for (const r of trapRows){
      if (trapProgress(r) < TRAP_DEADLY) continue;
      if (overlaps(strip, { x: r.x, y: level.trap.surf - 20, w: TRAP_W, h: 20 })) return false;
    }
  }
  return true;
}

  [24, 382], [80, 380], [140, 372], [200, 362], [240, 358], [285, 356], [330, 350], [375, 342], [406, 336],
  [448, 318], [475, 303], [500, 285], [522, 269], [540, 248], [553, 231],

const MAP_NODES = (() => {
  const segs = [];
  let total = 0;
  for (let i = 0; i < MAP_PATH.length - 1; i++){
    const dx = MAP_PATH[i + 1][0] - MAP_PATH[i][0], dy = MAP_PATH[i + 1][1] - MAP_PATH[i][1];
    const len = Math.hypot(dx, dy);
    segs.push({ x: MAP_PATH[i][0], y: MAP_PATH[i][1], dx, dy, len, acc: total });
    total += len;
  }
  const pts = [];
  for (let i = 0; i < LEVELS.length; i++){
    const d = total * i / (LEVELS.length - 1);
    let s = segs[segs.length - 1];
    for (const sg of segs) if (d <= sg.acc + sg.len){ s = sg; break; }
    const k = s.len ? (d - s.acc) / s.len : 0;

    const s = Math.sin(now / 210);
    ctx.beginPath(); ctx.arc(x, y, r + 4.5 + s * 2.5, 0, Math.PI * 2);
    ctx.strokeStyle = accent; ctx.globalAlpha = 0.45 + 0.3 * s; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 盘面
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (cleared){
    const gr = ctx.createLinearGradient(x, y - r, x, y + r);
    gr.addColorStop(0, "#ffe9a8"); gr.addColorStop(0.55, "#ffc95e"); gr.addColorStop(1, "#ef9a1c");
    ctx.fillStyle = gr;
  }
  else if (gate) ctx.fillStyle = "#2e3242";
  else if (frontier) ctx.fillStyle = accent;
  else if (locked) ctx.fillStyle = "#2e3242";
  else ctx.fillStyle = "#f3ead8";
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = cleared ? "#a86400" : gate ? "#ffd166" : frontier ? "rgba(255,255,255,0.9)" : locked ? "#6d6a8f" : accent;
  ctx.stroke();
  // 内圈刻线（石刻感）
  ctx.beginPath(); ctx.arc(x, y, r - 5, 0, Math.PI * 2);
  ctx.strokeStyle = cleared ? "rgba(122,72,0,0.32)" : frontier && !gate ? "rgba(255,255,255,0.35)" : (locked || gate) ? "rgba(255,255,255,0.07)" : "rgba(96,84,52,0.20)";
  ctx.lineWidth = 1; ctx.stroke();
  // 上沿高光弧
  ctx.beginPath(); ctx.arc(x, y, r - 2.6, -Math.PI * 0.82, -Math.PI * 0.18);
  ctx.strokeStyle = locked ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.55)";
  ctx.lineWidth = 2; ctx.stroke();
  if (locked){
    // 手绘锁：锁梁弧＋圆角锁身＋锁孔（代替数字，一眼可读）
    ctx.strokeStyle = "#a7aec7"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(x, y - 2.5, 4.8, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = "#a7aec7"; rr(x - 6.5, y - 2.5, 13, 10.5, 3); ctx.fill();
    ctx.fillStyle = "#2e3242";
    ctx.beginPath(); ctx.arc(x, y + 2.2, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.lineCap = "butt";
    if (gate){
      // 广告门标记：右下金徽＋深色播放三角（Canvas 画，不用 emoji）
      const bx = x + r * 0.78, by = y + r * 0.78;
      ctx.beginPath(); ctx.arc(bx, by, 7.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffd166"; ctx.fill();
      ctx.strokeStyle = "#14142b"; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = "#14142b";
      ctx.beginPath(); ctx.moveTo(bx - 2.4, by - 3.6); ctx.lineTo(bx - 2.4, by + 3.6); ctx.lineTo(bx + 3.8, by); ctx.closePath(); ctx.fill();
    }
    return;
  }
  // 数字（粗体）
  ctx.font = "bold " + (frontier ? 16 : 14) + "px system-ui"; ctx.textAlign = "center";
  if (frontier){ ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 3; }
  ctx.fillStyle = cleared ? "#5f3600" : frontier ? "#ffffff" : "#3c4152";
  ctx.fillText(String(i + 1), x, y + 5);
  ctx.shadowBlur = 0;
  if (cleared){
    // 右上角小圆徽＋白勾
    const bx = x + r * 0.74, by = y - r * 0.74;
    ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI * 2);
    ctx.fillStyle = "#2f9e44"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.8; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(bx - 3.2, by + 0.1); ctx.lineTo(bx - 0.9, by + 2.7); ctx.lineTo(bx + 3.6, by - 2.7); ctx.stroke();
    ctx.lineCap = "butt";
  }
}

async function tryUnlockRegion(region){
  const res = await unlockViaAdDetailed();
  if (res === "ok"){
    regionOpen[region] = true; saveRegions();
    gateCard = null; gateFailFree = false;
    sfx("goal");
  } else if (res === "fail"){
    gateFailFree = true;   // 卡保持打开，drawGateCard 据此多画一行兜底按钮
  }
  // cancel：什么都不变
}
function freeUnlockRegion(region){
  regionOpen[region] = true; saveRegions();
  gateCard = null; gateFailFree = false;
  sfx("goal");
}

function handleMapClick(x, y){
  audio();
  if (mapPanel === "skins"){ handleSkinClick(x, y); return; }
  if (mapPanel === "board" || mapPanel === "ach"){ mapPanel = null; return; }
  if (mapPanel === "settings"){
    for (const b of settingsBtns){
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){
        if (b.id === "music"){ settings.music = !Music.toggle(); saveSettings(); }
        else if (b.id === "sfx"){ sfxOn = !sfxOn; settings.sfx = sfxOn; saveSettings(); if (sfxOn) sfx("goal"); }
        else if (b.id === "close") mapPanel = null;
        return;
      }
    }
    mapPanel = null;
    return;
  }
  if (gateCard !== null){
    for (const b of gateBtns){
      if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) continue;
      if (b.kind === "close") gateCard = null;
      else if (b.kind === "unlock") tryUnlockRegion(gateCard);
      else if (b.kind === "free") freeUnlockRegion(gateCard);
      return;
    }
    gateCard = null;   // 点卡外关闭（与选关卡同口径）
    return;
  }
  if (mapCard !== null){
    for (const b of cardBtns){
      if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) continue;
      if (b.kind === "close") mapCard = null;
      else if (b.kind === "start"){ const i = mapCard; mapCard = null; startLevel(i); }
      else if (b.kind === "skin"){
        if (skins.unlocked.includes(b.id)){ skins.current = b.id; saveSkins(); }
        else tryUnlockSkin(b.id);
      }
      else if (b.kind === "wardrobe"){
        // 去换装：打开形象页，记住返回要恢复这张选关卡（mapCard 不清，面板盖在上面）
        skinsReturn = { type: "card", level: mapCard };
        mapPanel = "skins";
      }
      return;
    }
    mapCard = null;   // 点卡外关闭
    return;
  }
  for (const b of mapBtns){
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){
      if (b.id === "back") screen = "title";
      else { if (b.id === "skins") skinsReturn = null; mapPanel = b.id; }
      return;
    }
  }
  for (let i = 0; i < MAP_NODES.length; i++){
    const p = MAP_NODES[i];
    if (Math.hypot(x - p.x, y - p.y) <= 24){
      const gate = regionGateFor(i);
      if (i <= unlocked && gate){ gateCard = gate; gateFailFree = false; mapCard = null; sfx("goal"); }
      else if (i <= unlocked){ mapCard = i; sfx("goal"); }
      else {
        mapShake = { i, t0: performance.now() };
        mapHint = { text: regionOf(i) > regionOf(unlocked) ? "先通关上一区" : "先通关上一关", t0: performance.now() };
      }
      return;
    }
  }
}

/* ---------------- loop ---------------- */
let last = performance.now();
let frozen = false; // test-only freeze (set via __game.freeze)
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.033); last = now;
  // 加载页：核心资源全 settled 且最短展示 0.8s → 自动进标题（只在还停在 boot 时）；
  // 硬顶 8s：到点无论进度多少直接进标题（进度条停在真实进度、不伪造满格，未就绪
  // 资源走各自回退：小点/渐变背景/纯色地图底），绝不因等图锁人。进标题即启动穿搭懒加载。
  if (screen === "boot" && now - bootT0 >= 800 && (LOAD.done >= LOAD.total || now - bootT0 >= 8000)){
    screen = "title";
    startOutfitLazyLoad();
  }
  if (!frozen){ if (screen === "dying") tickDeath(dt); else step(dt); }
  draw();
  requestAnimationFrame(frame);
}
if (!settings.music) Music.setMuted(true);
loadLevel(0);
requestAnimationFrame(frame);

/* test hooks (read state + use the real controls) */
window.__game = {
  get screen(){ return screen; }, get ring(){ return ring; },
  get level(){ return levelIdx; }, get deaths(){ return deaths; },
  get unlocked(){ return unlocked; },
  get runShifts(){ return runShifts; },
  get records(){ return records; },
  get ach(){ return achDone.slice(); },
  get player(){ return { x: player.x, y: player.y, grounded: player.grounded }; },
  get tut(){ return { idx: tutIdx, total: tutSteps().length, current: tutCurrent() ? tutCurrent().text : null }; },
  get inverted(){ return inInvert(); }, get locked(){ return inLock(); },
  get phase(){ return runPhase; },
  get sprite(){ return { ready: naiwaReady, frame: naiwaFrame }; },
  get trap(){ return { rows: trapRows.map(r => ({ x: r.x, p: Math.round(trapProgress(r) * 100) / 100 })), scorch: trapScorch.length, hint: trapHintArmed }; },
  get revives(){ return revivesUsed; },
  get shield(){ return shield; },
  get shieldChip(){ return shieldChipVisible(); },
  get regions(){ return regionOpen.slice(); },
  get gateCard(){ return gateCard; },
  get gateFree(){ return gateFailFree; },
  ads: { failNext: () => { adFailNext = true; } },
  get checkpoint(){ return checkpoint ? { x: checkpoint.x, y: checkpoint.y, ring: checkpoint.ring, used: checkpoint.used } : null; },
  get checkpoints(){ return checkpoints.length; },
  get revivePoint(){ return reviveTarget(); },
  get runDeaths(){ return runDeaths; },
  get skinsReturn(){ return skinsReturn; },
  get invuln(){ return invulnT; },
  get deadBtns(){ return deadBtns.map(b => ({ action: b.action, disabled: !!b.disabled })); },
  get evDir(){ return evWarn ? evWarn.dir : 0; },
  get cd(){ return Math.round(shiftCD * 1000); },
  get budget(){ return { used: budgetUsed, max: budgetMax() === Infinity ? null : budgetMax(),
                         left: budgetLeft() === Infinity ? null : budgetLeft(), deny: denyReason }; },
  get gates(){ return (level.gates || []).map(g => ({ x: g.x, need: g.need })); },
  get gateFail(){ return gateFail ? { need: gateFail.need, used: gateFail.used, x: gateFail.x } : null; },
  get deathCause(){ return deathCause; },
  get buf(){ return { dir: bufDir, side: bufSide, rej: rejFxT > 0, rejSide }; },
  get fragile(){ return fragState.map((f, i) => ({ t: Math.round(f.t * 1000), broken: f.broken, fragile: !!level.platforms[i].fragile })); },
  get imprints(){ return imprintState.map(s => ({ stage: s.stage, t: Math.round(s.t * 1000), ring: s.ring })); },
  get echo(){ return { queued: echoQueue.length, off: Object.assign({}, echoOff) }; },
  get roomsOn(){ return ROOMS_ON; },
  get levelNames(){ return LEVELS.map(l => l.name); },
  get unlockedIdx(){ return unlocked; },
  get roomList(){ return ROOMS_ON ? ROOMS.map((r, i) => ({ idx: LEVELS.length - ROOMS.length + i, name: r.name })) : []; },
  get boot(){ return { done: LOAD.done, total: LOAD.total }; },
  get mapCard(){ return mapCard; },
  get mapPanel(){ return mapPanel; },
  get mapNodes(){ return MAP_NODES.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })); },
  get mapRegions(){ return MAP_REGIONS.map(r => r.name); },
  get phases(){ return (level.phases || []).map(p => phaseOf(p)); },
  pressShift, loadLevel: (i) => { loadLevel(i); screen = "play"; },
  // test-only: 手动推进一帧（配合 freeze 做确定性逐帧回放：物理只在被调用时走）
  step: (dt) => { step(dt || 1 / 240); },
  // test-only: place the player (auto-run has no stop input; used to exercise the trap kill branch)
  warp: (x, y) => { player.x = x; if (y !== undefined) player.y = y; player.vy = 0; },
  // test-only: freeze physics at a given run phase (for stride screenshots)
  freeze: (ph) => { runPhase = ph; frozen = true; },
  unfreeze: () => { frozen = false; },
  skins: {
    get: () => ({ unlocked: skins.unlocked.slice(), current: skins.current, unlockedOutfits: skins.unlockedOutfits.slice(), outfits: { hat: skins.outfits.hat, clothes: skins.outfits.clothes, hand: skins.outfits.hand } }),
    unlockForTest: (id) => { if (SKIN_DEFS.some(d => d.id === id) && !skins.unlocked.includes(id)){ skins.unlocked.push(id); saveSkins(); } },
    setCurrent: (id) => { if (skins.unlocked.includes(id)){ skins.current = id; saveSkins(); } },
    unlockOutfitForTest: (id) => { if (outfitDef(id) && !skins.unlockedOutfits.includes(id)){ skins.unlockedOutfits.push(id); saveSkins(); } },
    outfitsReady: () => OUTFIT_DEFS.every(d => OUTFIT_SETS[d.id].ready && OUTFIT_OVL[d.id].ready),
    // 测试专用：穿/脱（id=null 脱下）；会自动补解锁该件与奶蛙并切到奶蛙，方便验收直接进场
    wearForTest: (slot, id) => {
      if (!["hat", "clothes", "hand"].includes(slot)) return;
      if (id === null){ skins.outfits[slot] = null; saveSkins(); return; }
      const d = outfitDef(id);
      if (!d || d.slot !== slot) return;
      if (!skins.unlockedOutfits.includes(id)) skins.unlockedOutfits.push(id);
      if (!skins.unlocked.includes("frog")) skins.unlocked.push("frog");
      skins.current = "frog";
      skins.outfits[slot] = id;
      saveSkins();
    }
  }
};
</script>
<script type="module">
/* FX: pixelfx overlay (die / shift / clear) + matching synthesized sounds. If this module
   fails to load, the game itself is untouched and plays exactly as before. */
import { createFrame, clearFrame, createFx, composite } from "./lib/core/index.js";
import * as explosionFx from "./lib/fx/explosions/small-explosion.js";
import * as empFx from "./lib/fx/scifi/emp-blast.js";
import * as collectFx from "./lib/fx/pickups/collect-burst.js";

const GOLD = ["#2a1a04", "#5c3a08", "#9c6d14", "#d99a26", "#ffc23d", "#ffe26b", "#fff3a6", "#ffffff"];
const KINDS = {
  die:   { mod: explosionFx, scale: 1.3, opts: { size: 0.5 } },
  shift: { mod: empFx,       scale: 1.1, opts: {} },
  clear: { mod: collectFx,   scale: 1.5, opts: { palette: GOLD } },
};
const wrap = document.getElementById("wrap");
if (getComputedStyle(wrap).position === "static") wrap.style.position = "relative";
const ov = document.createElement("canvas");
ov.width = 960; ov.height = 540;
ov.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:transparent;";
wrap.appendChild(ov);
const octx = ov.getContext("2d");
octx.imageSmoothingEnabled = false;

/* --- matching sound for each effect (synthesized, no audio assets) --- */
let AC2 = null;
function audio2() {
  if (!AC2) { try { AC2 = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC2 && AC2.state === "suspended") AC2.resume();
  return AC2;
}
addEventListener("pointerdown", audio2, { once: true });
function env(g, t0, peak, dur) {
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
}
function noiseSrc(ac, dur) {
  const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(); s.buffer = buf; return s;
}
function playSound(kind) {
  const ac = audio2(); if (!ac) return;
  const t0 = ac.currentTime;
  if (kind === "die") {           // explosion: noise boom + low thump
    const n = noiseSrc(ac, 0.5), nf = ac.createBiquadFilter(), ng = ac.createGain();
    nf.type = "lowpass"; nf.frequency.setValueAtTime(3200, t0);
    nf.frequency.exponentialRampToValueAtTime(160, t0 + 0.45);
    env(ng, t0, 0.5, 0.5); n.connect(nf).connect(ng).connect(ac.destination); n.start(t0); n.stop(t0 + 0.5);
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(120, t0);
    o.frequency.exponentialRampToValueAtTime(30, t0 + 0.4);
    env(og, t0, 0.45, 0.42); o.connect(og).connect(ac.destination); o.start(t0); o.stop(t0 + 0.45);
  } else if (kind === "shift") {  // emp: electric zap sweep + crackle
    const o = ac.createOscillator(), og = ac.createGain(), bp = ac.createBiquadFilter();
    o.type = "sawtooth"; o.frequency.setValueAtTime(1250, t0);
    o.frequency.exponentialRampToValueAtTime(140, t0 + 0.24);
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 1.2;
    env(og, t0, 0.16, 0.26); o.connect(bp).connect(og).connect(ac.destination); o.start(t0); o.stop(t0 + 0.28);
    const n = noiseSrc(ac, 0.09), nf = ac.createBiquadFilter(), ng = ac.createGain();
    nf.type = "highpass"; nf.frequency.value = 2500;
    env(ng, t0, 0.12, 0.09); n.connect(nf).connect(ng).connect(ac.destination); n.start(t0); n.stop(t0 + 0.1);
  } else if (kind === "clear") {  // collect: bright little arpeggio
    [784, 988, 1175, 1568].forEach((f, i) => {
      const o = ac.createOscillator(), og = ac.createGain(), ts = t0 + i * 0.07;
      o.type = "triangle"; o.frequency.value = f;
      env(og, ts, 0.2, 0.3); o.connect(og).connect(ac.destination); o.start(ts); o.stop(ts + 0.32);
    });
  }
}

const active = [];
window.FX = {
  __acState() { return AC2 ? AC2.state : "none"; },
  spawn(kind, sx, sy) {
    const k = KINDS[kind]; if (!k) return;
    playSound(kind);
    const [w, h] = k.mod.meta.size, [ox, oy] = k.mod.meta.origin;
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    active.push({
      fx: createFx(k.mod, { x: ox, y: oy, seed: 7, ...k.opts }),
      frame: createFrame(w, h), c, cx: c.getContext("2d"),
      img: null, sx, sy, ox, oy, scale: k.scale,
    });
    const a = active[active.length - 1];
    a.img = a.cx.createImageData(w, h);
  },
};
let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  octx.clearRect(0, 0, 960, 540);
  for (let i = active.length - 1; i >= 0; i--) {
    const a = active[i];
    a.fx.update(dt);
    clearFrame(a.frame);
    a.fx.draw(a.frame);
    composite(a.frame, a.img.data, null);
    a.cx.putImageData(a.img, 0, 0);
    octx.drawImage(a.c, Math.round(a.sx - a.ox * a.scale), Math.round(a.sy - a.oy * a.scale),
      a.c.width * a.scale, a.c.height * a.scale);
    if (a.fx.done()) active.splice(i, 1);
  }
  requestAnimationFrame(loop);
})(performance.now());
</script>
