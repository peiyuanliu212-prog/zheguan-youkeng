let tutIdx = 0;
function tutSteps(){ return TUT[levelIdx] || []; }
function tutCurrent(){
  const steps = tutSteps();
  if (tutIdx >= steps.length) return null;
  const s = steps[tutIdx];
  return player.x >= (s.at || 0) ? s : null;
}
function tutAdvance(){
  const s = tutCurrent();
  if (!s) return;
  if (s.done.x !== undefined && player.x >= s.done.x) tutIdx++;
  else if (s.done.ring !== undefined && ring === s.done.ring) tutIdx++;
}

let unlocked = 0;

function commitLevel(){
  const rec = records.lv[levelIdx] || { t: null, s: null };
  if (rec.t === null || levelTime < rec.t) rec.t = Math.round(levelTime * 10) / 10;
  if (rec.s === null || levelShifts < rec.s) rec.s = levelShifts;
  records.lv[levelIdx] = rec; saveRecords();
  if (levelIdx === 0) unlockAch("first");
  if (levelIdx === 14) unlockAch("half");
  if (deaths === levelDeathsStart) unlockAch("clean");
}
function commitRun(){
  if (records.run.t === null || runTime < records.run.t) records.run.t = Math.round(runTime * 10) / 10;
  if (records.run.s === null || runShifts < records.run.s) records.run.s = runShifts;
  saveRecords();
  unlockAch("all");
  if (runShifts <= 720) unlockAch("frugal");
  if (runTime <= 1700) unlockAch("swift");
}

function curState(){ return CONFIG.states[ring]; }
function platActive(p){ const s = curState().plat; return p.set === "AB" || p.set === s; }
function spikeActive(s){ return s.set === curState().plat; }

function loadLevel(i){
  levelIdx = i; level = LEVELS[i];
  ring = 0; tutIdx = 0; shiftCD = 0; coyote = 0; airFlip = true;
  levelShifts = 0; levelTime = 0; levelDeathsStart = deaths;
  attemptTime = 0; evWarn = null; evDone = {}; orbTaken = {};
  trapRows = []; trapScorch = []; trapHintArmed = false; trapHintEver = false; deathFx = null; runPhase = 0;
  player.x = level.spawn.x; player.y = level.spawn.y;
  player.vx = 0; player.vy = 0; player.grounded = false;
  camX = 0; particles = [];
}
function respawn(){
  player.x = level.spawn.x; player.y = level.spawn.y;
  player.vx = 0; player.vy = 0;
  ring = 0; shiftCD = 0; coyote = 0; airFlip = true;
  attemptTime = 0; evWarn = null; evDone = {}; orbTaken = {};
  trapRows = [];
  trapHintArmed = lastDeathTrap && !trapHintEver;
  lastDeathTrap = false;
}

let denyT = 0; // ratchet deny feedback timer
let shiftCD = 0; // 移位冷却（秒）：防连切悬浮/穿刺——切档后 0.4s 内再切无效
let coyote = 0;  // 离地宽限（秒）：翻重力的输入宽容 0.12s
let airFlip = true; // 每段滞空只有一次空中翻重力的机会（落地重置、任何翻重力都消耗）——杀坑里悠悠球，保留下落中翻身跳岛
function ratchetZones(){
  const z = [];
  if (level.ratchet) z.push(level.ratchet);
  if (level.ratchet2) z.push(level.ratchet2);
  return z;
}
function inRatchet(){
  return ratchetZones().some(r => player.x >= r.x0 && player.x <= r.x1);
}
/* ---- v4 mechanics: movers / invert / speed / lock / events / orbs ---- */
let attemptTime = 0;              // resets every attempt: mover phases are deterministic per attempt
let evWarn = null;                // {dir, t} telegraphed forced shift (异变事件)
/* —— 《这关有坑》移位陷阱「落点生刺」——
   玩家在陷阱区内做平台组移位（状态切换使平台组 A/B 改变）后 0.25s，其正前方
   120px 处从地面升起一排刺，0.9s 升满，升起进度 ≥0.85 才致命：继续跑能在升满
   前穿过去，停留（或绕回来落上去）会被扎。触发只看移位与位置，完全确定性。
   升刺点留焦痕（本关内永久，跨重开保留）；第一次被此陷阱扎死后，重开的那一
   次尝试里在区起点给一行提示，只出现这一次。 */
const TRAP_DELAY = 0.25, TRAP_RISE = 0.9, TRAP_DEADLY = 0.85, TRAP_LEAD = 120, TRAP_W = 52;
let trapRows = [];        // {x, t0} 本次尝试内已触发的刺排（t0 = 开始升起的 attemptTime）
let trapScorch = [];      // {x} 焦痕标记
let trapHintArmed = false, trapHintEver = false;
let lastDeathTrap = false;
let deathFx = null;       // {x, y, grav, t} 死亡压扁残影（纯视觉，不改即时重开节奏）
let runPhase = 0, landSquash = 0, wasGrounded = false;
const SHOT = (() => { try { return new URLSearchParams(location.search).has("shot"); } catch(e){ return false; } })();
function trapProgress(r){ return Math.max(0, Math.min(1, (attemptTime - r.t0) / TRAP_RISE)); }
function trapTrigger(){
  if (!level.trap) return;
  const rowX = Math.round(player.x + 15 + TRAP_LEAD - TRAP_W / 2);
  trapRows.push({ x: rowX, t0: attemptTime + TRAP_DELAY });
  if (!trapScorch.some(s => Math.abs(s.x - rowX) < 30)) trapScorch.push({ x: rowX });
}
let evDone = {}, orbTaken = {};
function inZoneList(list){ return (list || []).some(r => player.x >= r.x0 && player.x <= r.x1); }
function inInvert(){ return inZoneList(level.inverts); }
function inLock(){ return inZoneList(level.locks); }
function speedMul(){
  let m = 1;
  for (const z of level.speeds || []) if (player.x >= z.x0 && player.x <= z.x1) m *= z.mul;
  return m;
}
function moverPos(m){
  const o = Math.sin(attemptTime * m.speed + m.phase) * m.dist;
  return { x: m.x + (m.axis === "x" ? o : 0), y: m.y + (m.axis === "y" ? o : 0) };
}
function forceShift(dir){
  ring = (ring + dir + CONFIG.states.length) % CONFIG.states.length;
  flash = 0.35; shake = Math.max(shake, 5);
  burst(player.x + 15, player.y + 15, "#ffd43b");
  sfx("shift", dir);
}
/* THE single entry point that may change the world state.
   Ratchet zones are the one exception to free shifting: inside them the
   ring only moves forward — backshift is denied (with feedback). */
function shift(dir){
  if (shiftCD > 0) return;
  if (inLock()){
    denyT = 1.0; shake = Math.max(shake, 4); sfx("deny");
    return;
  }
  if (dir < 0 && inRatchet()){
    denyT = 1.0; shake = Math.max(shake, 4); sfx("deny");
    return;
  }
  const next = (ring + dir + CONFIG.states.length) % CONFIG.states.length;
  const gravFlip = CONFIG.states[next].grav !== curState().grav;
  if (gravFlip && !player.grounded && coyote <= 0 && !airFlip){
    denyT = 1.0; shake = Math.max(shake, 4); sfx("deny");
    return;
  }
  const prevPlat = curState().plat;
  ring = next;
  if (gravFlip) airFlip = false;
  // 移位陷阱：陷阱区内发生平台组切换（A↔B）即触发「落点生刺」
  if (level.trap && curState().plat !== prevPlat && player.x >= level.trap.x0 && player.x <= level.trap.x1) trapTrigger();
  shiftCD = 0.4;
  runShifts++; levelShifts++;
  flash = 0.35; shake = Math.max(shake, 3);
  burst(player.x + 15, player.y + 15, curState().plat === "A" ? curState().platA : curState().platB);
  sfx("shift", dir);
}

/* ---------------- audio (tiny synth) ---------------- */
let AC = null;
function audio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === "suspended") AC.resume(); }
function tone(f0, f1, dur, type, vol){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type || "square"; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(vol || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
function sfx(kind, dir){
  if (!AC || !sfxOn) return;
  if (kind === "deny")  { tone(140, 90, 0.15, "sawtooth", 0.06); }
  if (kind === "shift") { tone(dir > 0 ? 320 : 520, dir > 0 ? 640 : 260, 0.12, "square", 0.05); }
  if (kind === "die")   { tone(300, 60, 0.25, "sawtooth", 0.07); }
  if (kind === "goal")  { tone(523, 523, 0.09, "square", 0.05); setTimeout(()=>tone(659,659,0.09,"square",0.05), 90); setTimeout(()=>tone(784,784,0.16,"square",0.05), 180); }
}

/* Chiptune loop: tiny lookahead sequencer, all synthesized (no audio files).
   Am – F – C – G, bass + arpeggio. Starts on game start, M toggles it. */
const Music = (() => {
  let started = false, muted = false, step = 0, nextT = 0, timer = null;
  const BPM = 116, EIGHTH = 60 / BPM / 2;
  const BASS = [45, 41, 48, 43];                    // A2 F2 C3 G2, one bar each
  const ARP  = [[57,60,64,69],[53,57,60,65],[55,60,64,67],[55,59,62,67]];
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, dest){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = mf(m);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }
  function schedule(){
    if (!AC) return;
    while (nextT < AC.currentTime + 0.25){
      const bar = Math.floor(step / 8) % 4, s8 = step % 8;
      if (!muted){
        const master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
        if (s8 === 0 || s8 === 3 || s8 === 6) note(BASS[bar], nextT, 0.22, "triangle", 0.20, master);
        if (s8 === 4) note(BASS[bar] + 7, nextT, 0.18, "triangle", 0.14, master);
        const arpNotes = ARP[bar];
        note(arpNotes[step % 4], nextT, 0.12, "square", 0.045, master);
        if (step % 16 === 14) note(arpNotes[3] + 12, nextT, 0.2, "square", 0.04, master);
      }
      step++; nextT += EIGHTH;
    }
  }
  return {
    start(){ if (started || !AC) return; started = true; step = 0; nextT = AC.currentTime + 0.06; timer = setInterval(schedule, 90); },
    toggle(){ muted = !muted; return muted; },
    setMuted(m){ muted = !!m; },
    get muted(){ return muted; }
  };
})();

/* ---------------- input ---------------- */
function pressShift(dir){
  audio();
  if (screen === "title" && titlePanel) { titlePanel = null; return; }
  if (screen === "title") { runTime = 0; deaths = 0; runShifts = 0; achToast = ""; screen = "play"; loadLevel(0); Music.start(); return; }
  if (screen === "win")   { screen = "title"; return; }
  if (screen !== "play") return;
  if (inInvert()) dir = -dir;   // 颠倒区：左右互换（输入层反转，规则照常生效）
  shift(dir);
}
window.addEventListener("keydown", (e) => {
  if (e.code === "ShiftLeft")  { if (!e.repeat) pressShift(1);  e.preventDefault(); }
  if (e.code === "ShiftRight") { if (!e.repeat) pressShift(-1); e.preventDefault(); }
  if (e.code === "KeyR" && screen === "play") { deaths++; respawn(); }
  if (e.code === "KeyM") { audio(); settings.music = !Music.toggle(); saveSettings(); }
  if (e.code === "Escape" && screen === "title") titlePanel = null;
  if (screen === "title" && /^Digit\d$/.test(e.code)) { const i = e.code === "Digit0" ? 9 : +e.code.slice(5) - 1; if (i < LEVELS.length && i <= unlocked) startLevel(i); }
});
let padL = null, padR = null; // touch/mouse pads drawn on canvas, hit-tested below
cv.addEventListener("pointerdown", (e) => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (CONFIG.viewW / r.width);
  const y = (e.clientY - r.top)  * (CONFIG.viewH / r.height);
  if (screen === "title"){
    if (titlePanel) { titlePanel = null; return; }
    for (const b of uiBtns){
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){
        if (b.id === "music") { audio(); settings.music = !Music.toggle(); saveSettings(); }
        else if (b.id === "sfx") { sfxOn = !sfxOn; settings.sfx = sfxOn; saveSettings(); if (sfxOn) sfx("goal"); }
        else if (b.id === "board") titlePanel = "board";
        else if (b.id === "ach") titlePanel = "ach";
        return;
      }
    }
    for (const b of titleBtns){
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){
        if (b.i <= unlocked) startLevel(b.i);
        return;
      }
    }
  }
  if (padL && x >= padL.x && x <= padL.x + padL.w && y >= padL.y && y <= padL.y + padL.h) pressShift(-1);
  else if (padR && x >= padR.x && x <= padR.x + padR.w && y >= padR.y && y <= padR.y + padR.h) pressShift(1);
  else if (screen !== "play") pressShift(1);
});
window.addEventListener("blur", () => { /* keys are event-driven; nothing sticks */ });

/* ---------------- physics ---------------- */
function burst(x, y, color){
  for (let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.45, color });
  }
}
function overlaps(a, b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function step(dt){
  if (screen === "clear") { clearTimer -= dt; if (clearTimer <= 0) { if (levelIdx + 1 > unlocked) { unlocked = Math.min(levelIdx + 1, LEVELS.length - 1); saveUnlock(); } if (levelIdx + 1 < LEVELS.length) { loadLevel(levelIdx + 1); screen = "play"; } else { commitRun(); screen = "win"; } } }
  if (screen !== "play") return;
  runTime += dt; levelTime += dt; attemptTime += dt;
  if (shiftCD > 0) shiftCD -= dt;
  const st = curState(), S = CONFIG.playerSize, PH = 22;
  player.vx = CONFIG.runSpeed * speedMul();
  player.vy += CONFIG.gravity * st.grav * dt;
  player.vy = Math.max(-CONFIG.maxFall, Math.min(CONFIG.maxFall, player.vy));

  // Platforms are one-way surfaces in the gravity axis: no side collision.
  // (Solid AABB sides pin the player on platform corners at state seams —
  //  see BUG_LOG 2026-11-21. Swept landing on the gravity-facing surface only.)
  const prevY = player.y;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.grounded = false;
  for (const p of level.platforms){
    if (!platActive(p)) continue;
    if (player.x + S <= p.x || player.x >= p.x + p.w) continue;
    if (st.grav > 0 && player.vy >= 0 && prevY + S <= p.y + 0.01 && player.y + S >= p.y){
      player.y = p.y - S; player.vy = 0; player.grounded = true;
    } else if (st.grav < 0 && player.vy <= 0 && prevY >= p.y + PH - 0.01 && player.y <= p.y + PH){
      player.y = p.y + PH; player.vy = 0; player.grounded = true;
    }
  }
  if (player.grounded) { coyote = 0.12; airFlip = true; } else coyote -= dt;
  let box = { x: player.x, y: player.y, w: S, h: S };
  // spikes
  box = { x: player.x + 5, y: player.y + 5, w: S - 10, h: S - 10 };
  for (const s of level.spikes){
    if (!spikeActive(s)) continue;
    const sb = s.hang ? { x: s.x, y: s.y, w: 26, h: 20 } : { x: s.x, y: s.y - 20, w: 26, h: 20 };
    if (overlaps(box, sb)) { die(); return; }
  }
  // moving spikes (patrolling hazards, phase-locked to the attempt clock)
  for (const m of level.movers || []){
    if (!spikeActive(m)) continue;
    const mp = moverPos(m);
    const sb = m.hang ? { x: mp.x, y: mp.y, w: 26, h: 20 } : { x: mp.x, y: mp.y - 20, w: 26, h: 20 };
    if (overlaps(box, sb)) { die(); return; }
  }
  // 移位陷阱「落点生刺」：升起进度 ≥0.85 的刺排致命
  if (level.trap){
    for (const r of trapRows){
      if (trapProgress(r) < TRAP_DEADLY) continue;
      const sb = { x: r.x, y: level.trap.surf - 20, w: TRAP_W, h: 20 };
      if (overlaps(box, sb)) { lastDeathTrap = true; die(); return; }
    }
  }
  // orbs: touching one restores the mid-air gravity flip (回气珠)
  for (let i = 0; i < (level.orbs || []).length; i++){
    if (orbTaken[i]) continue;
    const o = level.orbs[i], dx = player.x + 15 - o.x, dy = player.y + 15 - o.y;
    if (dx * dx + dy * dy < 36 * 36 && !airFlip){
      airFlip = true; orbTaken[i] = true;
      burst(o.x, o.y, "#66d9e8"); sfx("goal");
    }
  }
  // random events: telegraphed forced shift (异变)
  for (let i = 0; i < (level.events || []).length; i++){
    if (evDone[i]) continue;
    if (player.x >= level.events[i].x){
      evDone[i] = true;
      evWarn = { dir: Math.random() < 0.5 ? 1 : -1, t: 0.85 };
      sfx("deny");
    }
  }
  if (evWarn){
    evWarn.t -= dt;
    if (evWarn.t <= 0){ forceShift(evWarn.dir); evWarn = null; }
  }
  // fell / flew out
  if (player.y > CONFIG.killBelowY || player.y < CONFIG.killAboveY) { die(); return; }
  // goal (zone box; works for floor flags and ceiling flags)
  const g = level.goal;
  if (overlaps({ x: player.x, y: player.y, w: S, h: S }, g)){
    commitLevel();
    sfx("goal"); screen = "clear"; clearTimer = 1.1;
  }
  tutAdvance();
  if (!(SHOT && deathFx)) camX = Math.max(0, Math.min(level.width - CONFIG.viewW, player.x - 300));
  // particles
  for (const pt of particles){ pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
  particles = particles.filter(pt => pt.life > 0);
  // 奶蛙动画状态（纯视觉）：跑步相位随距离推进、落地压扁、死亡残影计时、提示已展示标记
  if (player.grounded) runPhase += player.vx * dt / 30;
  if (player.grounded && !wasGrounded) landSquash = 0.13;
  wasGrounded = player.grounded;
  if (landSquash > 0) landSquash -= dt;
  if (deathFx){ deathFx.t -= dt; if (deathFx.t <= 0) deathFx = null; }
  if (trapHintArmed) trapHintEver = true;
  if (flash > 0) flash -= dt;
  if (denyT > 0) denyT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 14);
}
function die(){
  deaths++; sfx("die"); burst(player.x + 15, player.y + 15, "#ff5d5d");
  deathFx = { x: player.x, y: player.y, grav: curState().grav, t: SHOT ? 3 : 0.45 };
  respawn();
}

/* ---------------- render ---------------- */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/* ---------------- 奶蛙（canvas 程序绘制，对着原图 naiwa_front / naiwa_side 还原） ----------------
   局部坐标：原点在脚底中心，+x 为朝向，身体在负 y 区，总高约 56px。
   特征清单：奶黄梨形大身子（下宽上窄）／正面下半部一整块奶白大圆肚皮／头顶两侧
   绿环眼＋黑大瞳（朝上略向外）／极细一条短横线嘴／灰褐手脚、四肢相对细长。
   奔跑：双腿大幅前后迈开（±13px）、双臂反向摆、身子随步频起伏并轻微前倾；
   gravUp 时整体上下翻转，贴天花板跑。 */
function drawFrog(cx, feetY, o){
  const YEL = "#f6c945", YEL_D = "#dfa92f", CREAM = "#fff7e9", BROWN = "#8a7a66", BROWN_D = "#77685a", GREEN = "#79c74f";
  ctx.save();
  ctx.globalAlpha = o.alpha === undefined ? 1 : o.alpha;
  ctx.translate(cx, feetY);
  if (o.gravUp) ctx.scale(1, -1);
  ctx.scale(o.face * (1 + (1 - o.squash) * 0.35), o.squash);
  const ph = o.phase || 0;
  const s = Math.sin(ph);
  const bob = o.airborne ? 0 : -Math.abs(s) * 1.6;
  ctx.translate(0, bob);
  if (!o.airborne) ctx.rotate(0.05);
  const leg = (hx, fx, fy, col, w) => {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(hx, -11);
    ctx.quadraticCurveTo(hx + (fx - hx) * 0.55, -4, fx, fy); ctx.stroke();
    ctx.fillStyle = BROWN;
    ctx.beginPath(); ctx.ellipse(fx + 2, -1.5, 5.2, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  };
  // 远侧腿（略暗，与近侧反相迈步；脚要迈出身体轮廓外才读得出大步）
  if (o.airborne) leg(-4, -15, -5, YEL_D, 7); else leg(-4, -5 - s * 24, s > 0 ? -4 : -1, YEL_D, 7);
  // 身子：梨形，下宽上窄、通体圆润
  ctx.fillStyle = YEL;
  ctx.beginPath();
  ctx.moveTo(-19, -4);
  ctx.bezierCurveTo(-21, -22, -15, -38, -10, -47);
  ctx.bezierCurveTo(-6, -53.5, 6, -53.5, 10, -47);
  ctx.bezierCurveTo(15, -38, 20, -24, 19, -6);
  ctx.bezierCurveTo(12, -0.5, -12, -0.5, -19, -4);
  ctx.closePath(); ctx.fill();
  // 肚皮：正面下半部一整块奶白大圆
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.ellipse(3.5, -21, 13.5, 15.5, -0.08, 0, Math.PI * 2); ctx.fill();
  // 远侧手：灰褐色小手搭在肚皮左侧（原图里双手都扶在肚皮上）
  ctx.fillStyle = BROWN_D;
  ctx.beginPath(); ctx.arc(-8, -19, 3.8, 0, Math.PI * 2); ctx.fill();
  // 近侧腿：迈开大步
  if (o.airborne) leg(4, 16, -7, YEL, 7.5); else leg(4, 5 + s * 24, s > 0 ? -1 : -4, YEL, 7.5);
  // 近侧臂：与近侧腿反向摆动，手是灰褐色
  const hx2 = 7 - s * 9, hy2 = -18;
  ctx.strokeStyle = YEL; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(7, -34);
  ctx.quadraticCurveTo(7 + (hx2 - 7) * 0.5, -26, hx2, hy2); ctx.stroke();
  ctx.fillStyle = BROWN;
  ctx.beginPath(); ctx.arc(hx2, hy2, 4.3, 0, Math.PI * 2); ctx.fill();
  // 眼睛：头顶两侧，绿圆环＋黑色大瞳孔，朝上、略向外
  const eye = (ex, ey2, r) => {
    ctx.fillStyle = GREEN;
    ctx.beginPath(); ctx.arc(ex, ey2, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#101010";
    ctx.beginPath(); ctx.arc(ex + 0.9, ey2 - 0.9, r * 0.58, 0, Math.PI * 2); ctx.fill();
  };
  eye(-6.5, -48.5, 4.6); eye(8, -49.5, 4.3);
  // 嘴：极细的一条短横线
  ctx.strokeStyle = "rgba(96,74,40,0.9)"; ctx.lineWidth = 1.3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(8.5, -40.5); ctx.lineTo(15, -41); ctx.stroke();
  ctx.restore();
}
function draw(){
  const st = curState(), W = CONFIG.viewW, H = CONFIG.viewH;
  ctx.fillStyle = st.sky; ctx.fillRect(0, 0, W, H);
  const sx = shake ? (Math.random() - 0.5) * shake : 0;
  const sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.save(); ctx.translate(-camX + sx, sy);
  // far silhouettes
  ctx.fillStyle = st.far;
  for (let i = 0; i < 14; i++){ const bx = i * 260 + 40; ctx.fillRect(bx, 300 - (i % 3) * 40, 90, 260); }
  // ratchet zone stripes
  for (const r of ratchetZones()){
    ctx.fillStyle = "rgba(255,92,92,0.06)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.strokeStyle = "rgba(255,92,92,0.35)"; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(r.x0, 0); ctx.lineTo(r.x0, CONFIG.viewH); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,120,120,0.8)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("⇢ 棘轮区 — 只能向前", r.x0 + 12, 90);
  }
  // v4 zone tints
  for (const r of level.inverts || []){
    ctx.fillStyle = "rgba(177,106,255,0.07)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.fillStyle = "rgba(200,150,255,0.85)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("⇄ 颠倒区 — 左右互换", r.x0 + 12, 90);
  }
  for (const r of level.locks || []){
    ctx.fillStyle = "rgba(160,170,190,0.10)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.fillStyle = "rgba(200,210,225,0.85)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("⊘ 凝滞区 — 无法移位", r.x0 + 12, 90);
  }
  for (const r of level.speeds || []){
    ctx.fillStyle = "rgba(255,212,59,0.05)"; ctx.fillRect(r.x0, 0, r.x1 - r.x0, CONFIG.viewH);
    ctx.fillStyle = "rgba(255,220,100,0.85)"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
    ctx.fillText("» 加速区", r.x0 + 12, 90);
  }
  // ghost (inactive) platforms first
  for (const p of level.platforms){
    if (platActive(p)) continue;
    ctx.strokeStyle = p.set === "A" ? st.platA : st.platB;
    ctx.globalAlpha = 0.35; ctx.setLineDash([7, 7]); ctx.lineWidth = 2;
    ctx.lineDashOffset = -performance.now() / 28;
    ctx.strokeRect(p.x, p.y, p.w, 22); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  // active platforms
  for (const p of level.platforms){
    if (!platActive(p)) continue;
    ctx.fillStyle = p.set === "B" ? st.platB : st.platA;
    if (p.set === "AB") ctx.fillStyle = "#8d99ae";
    rr(p.x, p.y, p.w, 22, 5); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(p.x, p.y, p.w, 4);
  }
  // spikes
  for (const s of level.spikes){
    if (!spikeActive(s)) { ctx.globalAlpha = 0.3; }
    ctx.fillStyle = "#ff5d5d";
    ctx.beginPath();
    if (s.hang){ ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + 13, s.y + 20); ctx.lineTo(s.x + 26, s.y); }
    else { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + 13, s.y - 20); ctx.lineTo(s.x + 26, s.y); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
  // movers: track + spike at current phase position
  for (const m of level.movers || []){
    const mp = moverPos(m);
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2;
    ctx.beginPath();
    if (m.axis === "y"){ ctx.moveTo(m.x + 13, m.y - m.dist); ctx.lineTo(m.x + 13, m.y + m.dist); }
    else { ctx.moveTo(m.x - m.dist, m.y - 10); ctx.lineTo(m.x + m.dist, m.y - 10); }
    ctx.stroke();
    if (!spikeActive(m)) ctx.globalAlpha = 0.3;
    ctx.fillStyle = "#ff922b";
    ctx.beginPath();
    if (m.hang){ ctx.moveTo(mp.x, mp.y); ctx.lineTo(mp.x + 13, mp.y + 20); ctx.lineTo(mp.x + 26, mp.y); }
    else { ctx.moveTo(mp.x, mp.y); ctx.lineTo(mp.x + 13, mp.y - 20); ctx.lineTo(mp.x + 26, mp.y); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
  // orbs
  for (let i = 0; i < (level.orbs || []).length; i++){
    if (orbTaken[i]) continue;
    const o = level.orbs[i], pr = 10 + Math.sin(performance.now() / 240) * 2;
    ctx.strokeStyle = "#66d9e8"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(o.x, o.y, pr + 5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#a5f3fc";
    ctx.beginPath(); ctx.arc(o.x, o.y, pr - 3, 0, Math.PI * 2); ctx.fill();
  }
  // goal flag (stands on a floor surface, or hangs from a ceiling one)
  const g = level.goal;
  if (g.ceil){
    ctx.fillStyle = "#e9ecef"; ctx.fillRect(g.x + 15, g.surf, 4, 62);
    ctx.fillStyle = "#51cf66"; ctx.beginPath();
    ctx.moveTo(g.x + 19, g.surf + 34); ctx.lineTo(g.x + 49, g.surf + 48); ctx.lineTo(g.x + 19, g.surf + 62);
  } else {
    ctx.fillStyle = "#e9ecef"; ctx.fillRect(g.x + 15, g.surf - 92, 4, 92);
    ctx.fillStyle = "#51cf66"; ctx.beginPath();
    ctx.moveTo(g.x + 19, g.surf - 92); ctx.lineTo(g.x + 49, g.surf - 78); ctx.lineTo(g.x + 19, g.surf - 64);
  }
  ctx.closePath(); ctx.fill();
  // 移位陷阱：焦痕（永久标记）→ 正在升起的刺排 → 死后提示（只出现一次）
  if (level.trap){
    const surf = level.trap.surf;
    for (const s of trapScorch){
      ctx.fillStyle = "rgba(24,14,8,0.55)";
      ctx.beginPath(); ctx.ellipse(s.x + TRAP_W / 2, surf - 1, TRAP_W / 2 + 4, 4.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(24,14,8,0.8)";
      ctx.fillRect(s.x + 8, surf - 4, 5, 3); ctx.fillRect(s.x + 26, surf - 5, 6, 4); ctx.fillRect(s.x + 42, surf - 4, 5, 3);
    }
    for (const r of trapRows){
      const p = trapProgress(r);
      if (p <= 0) continue;
      const h = 20 * p;
      ctx.fillStyle = "#ff5d5d";
      for (let k = 0; k < 2; k++){
        const sx2 = r.x + k * 26;
        ctx.beginPath(); ctx.moveTo(sx2, surf); ctx.lineTo(sx2 + 13, surf - h); ctx.lineTo(sx2 + 26, surf); ctx.closePath(); ctx.fill();
      }
    }
    if (trapHintArmed && player.x < level.trap.x1){
      const hx = level.trap.x0 + 14, hy = surf - 64;
      ctx.font = "bold 15px system-ui";
      const tw = ctx.measureText("移位之后，别停").width + 24;
      ctx.fillStyle = "rgba(8,10,24,0.88)"; rr(hx, hy, tw, 30, 9); ctx.fill();
      ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 1.5; rr(hx, hy, tw, 30, 9); ctx.stroke();
      ctx.fillStyle = "#ffd166"; ctx.textAlign = "left";
      ctx.fillText("移位之后，别停", hx + 12, hy + 20);
    }
  }
  // player —— 奶蛙（碰撞盒仍是原 30px，绘制约 56px 高，脚底对齐盒底边）
  const S = CONFIG.playerSize;
  const sq = landSquash > 0 ? 1 - 0.25 * Math.sin(Math.PI * (1 - landSquash / 0.13)) : 1;
  drawFrog(player.x + S / 2, st.grav > 0 ? player.y + S : player.y,
    { face: player.vx < 0 ? -1 : 1, gravUp: st.grav < 0, phase: runPhase, airborne: !player.grounded, squash: sq, alpha: 1 });
  if (deathFx){
    drawFrog(deathFx.x + S / 2, deathFx.grav > 0 ? deathFx.y + S : deathFx.y,
      { face: 1, gravUp: deathFx.grav < 0, phase: Math.PI / 2, airborne: false, squash: 0.22, alpha: 0.95 });
  }
  // particles
  for (const pt of particles){ ctx.globalAlpha = Math.max(pt.life, 0) * 1.8; ctx.fillStyle = pt.color; ctx.fillRect(pt.x - 3, pt.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0){ ctx.fillStyle = "rgba(255,255,255," + (flash * 0.5) + ")"; ctx.fillRect(0, 0, W, H); }

  if (evWarn && screen === "play"){
    ctx.fillStyle = "rgba(20,10,0,0.45)"; ctx.fillRect(0, 150, W, 64);
    ctx.fillStyle = "#ffd43b"; ctx.font = "bold 26px system-ui"; ctx.textAlign = "center";
    ctx.fillText(evWarn.dir > 0 ? "⚠ 异变！即将强制前移 →" : "⚠ 异变！即将强制后移 ←", W / 2, 192);
  }
  if (screen === "play" || screen === "clear") drawHUD();
  if (screen === "title") drawTitle();
  if (screen === "clear") centerText("过关！", achToast, "#51cf66");
  if (screen === "win") drawWin();
  // touch pads
  padL = { x: 16, y: H - 92, w: 196, h: 74 }; padR = { x: W - 212, y: H - 92, w: 196, h: 74 };
  if (screen === "play" && !SHOT){
    ctx.globalAlpha = 0.55; ctx.fillStyle = "#ffffff";
    rr(padL.x, padL.y, padL.w, padL.h, 14); ctx.fill();
    rr(padR.x, padR.y, padR.w, padR.h, 14); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = "#14142b"; ctx.font = "bold 21px system-ui"; ctx.textAlign = "center";
    const inv = screen === "play" && inInvert();
    ctx.fillText(inv ? "前移 ▶" : "◀ 后移", padL.x + padL.w / 2, padL.y + 46);
    ctx.fillText(inv ? "◀ 后移" : "前移 ▶", padR.x + padR.w / 2, padR.y + 46);
  }
  drawTut();
}
function drawHUD(){
  const W = CONFIG.viewW, st = curState();
  ctx.fillStyle = "rgba(0,0,0,0.35)"; rr(14, 12, 250, 34, 9); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "left";
  ctx.fillText(level.name, 26, 34);
  // state ring dots
  for (let i = 0; i < 4; i++){
    const x = W / 2 - 66 + i * 44;
    ctx.beginPath(); ctx.arc(x, 29, i === ring ? 13 : 9, 0, Math.PI * 2);
    ctx.fillStyle = i === ring ? CONFIG.states[i].platB : "rgba(255,255,255,0.25)"; ctx.fill();
  }
  ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "center";
  ctx.fillText(st.name, W / 2, 66);
  if (screen === "play" && inRatchet()){
    ctx.fillStyle = "#ff8787"; ctx.font = "bold 13px system-ui";
    ctx.fillText("棘轮区 — 不能后移", W / 2, 88);
  }
  if (denyT > 0){
    ctx.fillStyle = "rgba(255,80,80," + Math.min(denyT, 1) + ")"; ctx.font = "bold 24px system-ui";
    ctx.fillText("✕ 已锁定 — 只能向前", W / 2, 128);
  }
  ctx.fillStyle = "rgba(0,0,0,0.35)"; rr(W - 130, 12, 116, 34, 9); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.fillText("死亡 " + deaths, W - 26, 34);
}
function drawTut(){
  if (screen !== "play") return;
  const s = tutCurrent();
  if (!s) return;
  const W = CONFIG.viewW;
  // speech bar, bottom-center, above the pads
  ctx.font = "16px system-ui";
  const tw = Math.min(ctx.measureText(s.text).width + 44, W - 60);
  const bx = (W - tw) / 2, by = CONFIG.viewH - 168;
  ctx.fillStyle = "rgba(8,10,24,0.88)"; rr(bx, by, tw, 42, 12); ctx.fill();
  ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2; rr(bx, by, tw, 42, 12); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center";
  ctx.fillText(s.text, W / 2, by + 27, tw - 28);
  // pulse ring on the REAL control this step names
  const pad = s.hl === "F" ? padR : s.hl === "B" ? padL : null;
  if (pad){
    const a = 0.55 + 0.45 * Math.sin(performance.now() / 220);
    ctx.strokeStyle = "rgba(255,209,102," + a + ")"; ctx.lineWidth = 4;
    rr(pad.x - 6, pad.y - 6, pad.w + 12, pad.h + 12, 16); ctx.stroke();
    ctx.fillStyle = "rgba(255,209,102," + a + ")"; ctx.font = "bold 15px system-ui";
    ctx.fillText("▼ 点这个", pad.x + pad.w / 2, pad.y - 16);
  }
}
function centerText(big, small, color){
  const W = CONFIG.viewW, H = CONFIG.viewH;
  ctx.fillStyle = "rgba(5,6,16,0.72)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = color; ctx.font = "bold 54px system-ui"; ctx.textAlign = "center";
  ctx.fillText(big, W / 2, H / 2 - 8);
  ctx.fillStyle = "#dfe3ee"; ctx.font = "19px system-ui";
  ctx.fillText(small, W / 2, H / 2 + 34);
}
function drawTitle(){
  const W = CONFIG.viewW, H = CONFIG.viewH;
  ctx.fillStyle = "rgba(5,6,16,0.78)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 76px system-ui";
  ctx.fillText("这关有坑", W / 2, 168);
  // 选关按钮，三行 × 10（命中区与 pointerdown 共用 titleBtns）
  titleBtns = [];
  const bw = 76, bh = 48, gap = 10, per = 10;
  const rowW = bw * per + gap * (per - 1), bx0 = (W - rowW) / 2;
  for (let i = 0; i < LEVELS.length; i++){
    const bx = bx0 + (i % per) * (bw + gap), by = 232 + Math.floor(i / per) * 62;
    titleBtns.push({ x: bx, y: by, w: bw, h: bh, i });
    const open = i <= unlocked;
    ctx.fillStyle = open ? "#ffd166" : "rgba(255,255,255,0.10)";
    rr(bx, by, bw, bh, 10); ctx.fill();
    ctx.fillStyle = open ? "#14142b" : "#8d99ae"; ctx.font = "bold 20px system-ui";
    ctx.fillText(open ? String(i + 1) : "🔒", bx + bw / 2, by + 32);
  }
  ctx.fillStyle = "#aeb6cc"; ctx.font = "16px system-ui";
  ctx.fillText("点任意处开始", W / 2, 476);
  // 底部一行：音乐/音效开关与排行榜/成就入口（uiBtns 与 pointerdown 共用）
  uiBtns = [];
  const items = [
    { id: "music", label: "音乐 " + (settings.music ? "开" : "关"), x: 150 },
    { id: "sfx",   label: "音效 " + (sfxOn ? "开" : "关"),          x: 330 },
    { id: "board", label: "排行榜",                                 x: 630 },
    { id: "ach",   label: "成就",                                   x: 800 }
  ];
  ctx.font = "15px system-ui";
  for (const it of items){
    uiBtns.push({ x: it.x - 70, y: 484, w: 140, h: 38, id: it.id });
    ctx.fillStyle = "#8d99ae";
    ctx.fillText(it.label, it.x, 508);
  }
  if (titlePanel === "board") drawBoard();
  if (titlePanel === "ach") drawAchPanel();
}
function fmtT(v){ return v === null || v === undefined ? "—" : v.toFixed(1) + "s"; }
function panelBox(){
  ctx.fillStyle = "rgba(5,6,16,0.95)"; rr(110, 46, 740, 448, 14); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1; rr(110, 46, 740, 448, 14); ctx.stroke();
}
function drawBoard(){
  panelBox();
  ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui";
  ctx.fillText("排行榜", 480, 92);
  ctx.font = "14px system-ui"; ctx.fillStyle = "#8d99ae";
  for (const bx of [150, 520]){
    ctx.textAlign = "left";   ctx.fillText("关卡", bx, 126);
    ctx.textAlign = "center"; ctx.fillText("最速", bx + 170, 126); ctx.fillText("最少移位", bx + 290, 126);
  }
  ctx.font = "14px system-ui";
  for (let i = 0; i < LEVELS.length; i++){
    const bx = i < 15 ? 150 : 520, y = 150 + (i % 15) * 20, rec = records.lv[i];
    ctx.textAlign = "left"; ctx.fillStyle = "#dfe3ee";
    ctx.fillText("第 " + (i + 1) + " 关", bx, y);
    ctx.textAlign = "center"; ctx.fillStyle = "#fff";
    ctx.fillText(fmtT(rec ? rec.t : null), bx + 170, y);
    ctx.fillText(rec && rec.s !== null && rec.s !== undefined ? String(rec.s) : "—", bx + 290, y);
  }
  const y = 452;
  ctx.textAlign = "left"; ctx.fillStyle = "#ffd166";
  ctx.fillText("全程", 150, y);
  ctx.textAlign = "center";
  ctx.fillText(fmtT(records.run.t), 320, y);
  ctx.fillText(records.run.s === null || records.run.s === undefined ? "—" : String(records.run.s), 440, y);
  ctx.fillStyle = "#8d99ae"; ctx.font = "13px system-ui";
  ctx.fillText("点任意处关闭", 480, 478);
}
function drawAchPanel(){
  panelBox();
  ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui";
  ctx.fillText("成就", 480, 92);
  ACH.forEach((a, i) => {
    const y = 150 + i * 52, got = achDone.includes(a.id);
    ctx.textAlign = "left"; ctx.fillStyle = got ? "#ffd166" : "#dfe3ee"; ctx.font = "16px system-ui";
    ctx.fillText(a.name, 190, y);
    ctx.fillStyle = "#8d99ae"; ctx.font = "14px system-ui";
    ctx.fillText(a.desc, 190, y + 22);
    ctx.textAlign = "right"; ctx.fillStyle = got ? "#51cf66" : "#5b6478"; ctx.font = "16px system-ui";
    ctx.fillText(got ? "已达成" : "未达成", 770, y);
  });
  ctx.textAlign = "center"; ctx.fillStyle = "#8d99ae"; ctx.font = "13px system-ui";
  ctx.fillText("点任意处关闭", 480, 478);
}
function drawWin(){
  const W = CONFIG.viewW, H = CONFIG.viewH;
  ctx.fillStyle = "rgba(5,6,16,0.8)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#51cf66"; ctx.font = "bold 52px system-ui";
  ctx.fillText("全部移位完成", W / 2, 216);
  ctx.fillStyle = "#dfe3ee"; ctx.font = "20px system-ui";
  ctx.fillText("用时 " + runTime.toFixed(1) + " 秒 · 移位 " + runShifts + " 次 · 死亡 " + deaths + " 次", W / 2, 268);
  if (achToast){
    ctx.fillStyle = "#ffd166"; ctx.font = "16px system-ui";
    ctx.fillText(achToast, W / 2, 306);
  }
  ctx.fillStyle = "#8d99ae"; ctx.font = "15px system-ui";
  ctx.fillText("点任意处回到标题", W / 2, 362);
}

/* ---------------- loop ---------------- */
let last = performance.now();
let frozen = false; // test-only freeze (set via __game.freeze)
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.033); last = now;
  if (!frozen) step(dt);
  draw();
  requestAnimationFrame(frame);
}
if (!settings.music) Music.setMuted(true);
loadLevel(0);
requestAnimationFrame(frame);

/* test hooks (read state + use the real controls) */
window.__game = {
  get screen(){ return screen; }, get ring(){ return ring; },
  get level(){ return levelIdx; }, get deaths(){ return deaths; },
  get unlocked(){ return unlocked; },
  get runShifts(){ return runShifts; },
  get records(){ return records; },
  get ach(){ return achDone.slice(); },
  get player(){ return { x: player.x, y: player.y, grounded: player.grounded }; },
  get tut(){ return { idx: tutIdx, total: tutSteps().length, current: tutCurrent() ? tutCurrent().text : null }; },
  get inverted(){ return inInvert(); }, get locked(){ return inLock(); },
  get phase(){ return runPhase; },
  get trap(){ return { rows: trapRows.map(r => ({ x: r.x, p: Math.round(trapProgress(r) * 100) / 100 })), scorch: trapScorch.length, hint: trapHintArmed }; },
  get evDir(){ return evWarn ? evWarn.dir : 0; },
  pressShift, loadLevel: (i) => { loadLevel(i); screen = "play"; },
  // test-only: place the player (auto-run has no stop input; used to exercise the trap kill branch)
  warp: (x, y) => { player.x = x; if (y !== undefined) player.y = y; player.vy = 0; },
  // test-only: freeze physics at a given run phase (for stride screenshots)
  freeze: (ph) => { runPhase = ph; frozen = true; },
  unfreeze: () => { frozen = false; }
};
